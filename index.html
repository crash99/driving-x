<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاقیکردنەوەی تیۆری هاتوچۆ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --led-cyan: #00f2fe;
            --led-blue: #4facfe;
            --led-pink: #ff007f;
            --led-green: #00ff87;
            --led-amber: #ffaa00;
            --led-red: #ff3366;
            --bg-dark: #080c14;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(0, 242, 254, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 90%, rgba(255, 0, 127, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(0, 255, 135, 0.05) 0%, transparent 40%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            direction: rtl;
            overflow-x: hidden;
        }

        .app-led-wrapper {
            position: relative;
            width: 100%;
            max-width: 540px;
            border-radius: 26px;
            padding: 3.5px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.25), 0 25px 60px -15px rgba(0, 0, 0, 0.9);
            margin: auto;
        }

        .led-border-glow {
            position: absolute;
            width: 250%;
            height: 250%;
            top: -75%;
            left: -75%;
            background: conic-gradient(
                from 0deg,
                var(--led-cyan),
                var(--led-blue),
                var(--led-pink),
                var(--led-amber),
                var(--led-green),
                var(--led-cyan)
            );
            animation: rotate-led 4s linear infinite;
            z-index: 1;
            filter: blur(5px);
        }

        .led-border-glow-extra {
            position: absolute;
            width: 250%;
            height: 250%;
            top: -75%;
            left: -75%;
            background: conic-gradient(
                from 180deg,
                var(--led-pink),
                var(--led-cyan),
                var(--led-green),
                var(--led-amber),
                var(--led-blue),
                var(--led-pink)
            );
            animation: rotate-led 6s linear infinite reverse;
            z-index: 1;
            filter: blur(14px);
            opacity: 0.65;
        }

        @keyframes rotate-led {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .app-container {
            width: 100%;
            background: #0e1628;
            border-radius: 23px;
            overflow: hidden;
            position: relative;
            z-index: 2;
            min-height: 560px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .led-runner-line {
            height: 3px;
            width: 100%;
            background: linear-gradient(90deg, transparent, var(--led-cyan), var(--led-pink), var(--led-green), transparent);
            background-size: 200% 100%;
            animation: runner-move 3s ease infinite;
        }

        @keyframes runner-move {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        .app-header-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: rgba(11, 17, 32, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid rgba(255, 255, 255, 0.06);
            padding: 16px;
            position: relative;
        }

        .app-header-title {
            color: #ffffff;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .content-section {
            padding: 24px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .crash-spinner-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto 0;
            width: 100%;
            gap: 25px;
            padding: 30px 0;
            cursor: pointer;
        }

        .spinner-container {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .spinner-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid transparent;
            border-top-color: var(--led-cyan);
            border-right-color: var(--led-pink);
            animation: spin-ring 2s linear infinite;
        }

        .spinner-ring:nth-child(2) {
            width: 85%;
            height: 85%;
            top: 7.5%;
            left: 7.5%;
            border-top-color: var(--led-green);
            border-right-color: var(--led-amber);
            animation: spin-ring 1.5s linear infinite reverse;
        }

        .spinner-ring:nth-child(3) {
            width: 70%;
            height: 70%;
            top: 15%;
            left: 15%;
            border-top-color: var(--led-blue);
            border-right-color: var(--led-red);
            animation: spin-ring 2.5s linear infinite;
        }

        @keyframes spin-ring {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .crash-title {
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(
                90deg,
                var(--led-cyan),
                var(--led-pink),
                var(--led-green),
                var(--led-cyan)
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 3s linear infinite, glow-pulse 2s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.5);
            letter-spacing: 8px;
            position: relative;
        }

        @keyframes gradient-shift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        @keyframes glow-pulse {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 10px rgba(0, 242, 254, 0.6)); }
            50% { filter: brightness(1.3) drop-shadow(0 0 25px rgba(255, 0, 127, 0.8)); }
        }

        .activation-box {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto 0;
            width: 100%;
            text-align: center;
            padding: 10px 0;
        }

        .activation-icon-glow {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.2) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 2px solid var(--led-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 16px;
            animation: lock-pulse 2s infinite alternate;
        }

        @keyframes lock-pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }
            100% { transform: scale(1.06); box-shadow: 0 0 25px rgba(0, 242, 254, 0.6); }
        }

        .activation-title {
            font-size: 21px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #ffffff, var(--led-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .activation-subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 22px;
            font-weight: 500;
        }

        .activation-input-wrap {
            position: relative;
            width: 100%;
            max-width: 300px;
            margin-bottom: 12px;
        }

        .activation-input-wrap input {
            width: 100%;
            padding: 12px 42px 12px 14px;
            border: 1.5px solid rgba(0, 242, 254, 0.4);
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            text-align: center;
            background: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            outline: none;
            transition: all 0.25s ease;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.15), inset 0 2px 4px rgba(0, 0, 0, 0.4);
            direction: ltr;
        }

        .activation-input-wrap input:focus {
            border-color: var(--led-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.5), inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .toggle-pwd-btn {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 17px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .toggle-pwd-btn:hover { color: #ffffff; }

        .activation-msg {
            width: 100%;
            max-width: 300px;
            min-height: 28px;
            font-size: 14px;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 14px;
            display: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .activation-msg.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #f87171;
            box-shadow: 0 0 14px rgba(239, 68, 68, 0.35);
        }

        .activation-msg.success {
            display: block;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #34d399;
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.4);
        }

        .language-selector {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto 0;
            width: 100%;
            text-align: center;
            padding: 20px 0;
            gap: 18px;
        }

        .language-selector h2 {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ffffff, var(--led-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .language-btn {
            width: 100%;
            max-width: 320px;
            padding: 16px 24px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #ffffff;
            border: 2px solid rgba(0, 242, 254, 0.5);
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            border-radius: 14px;
            text-align: center;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .language-btn:hover {
            border-color: var(--led-cyan);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.5);
            transform: translateY(-3px) scale(1.02);
            background: linear-gradient(135deg, #25334d, #14203a);
        }

        .flag-icon { font-size: 28px; line-height: 1; }

        .led-dot {
            width: 9px;
            height: 9px;
            background-color: var(--led-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--led-green);
            animation: pulse-led 1.8s infinite;
        }

        @keyframes pulse-led {
            0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 10px var(--led-green); }
            50% { opacity: 0.4; transform: scale(0.85); box-shadow: 0 0 4px var(--led-green); }
        }

        .login-box {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto 0;
            width: 100%;
        }

        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 14px;
            width: 100%;
            max-width: 340px;
        }

        .form-row label {
            font-size: 15px;
            font-weight: 700;
            color: #f1f5f9;
            width: 110px;
            text-align: right;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-row input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            background: rgba(15, 23, 42, 0.85);
            color: #ffffff;
            outline: none;
            transition: all 0.25s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        #form-number { direction: ltr; }

        .form-row input:focus {
            border-color: var(--led-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.35), inset 0 2px 4px rgba(0, 0, 0, 0.4);
            background: rgba(15, 23, 42, 0.95);
        }

        .form-row input[readonly] {
            background: rgba(30, 41, 59, 0.6);
            color: #38bdf8;
            border-color: rgba(56, 189, 248, 0.2);
            cursor: default;
        }

        .btn-action {
            width: 160px;
            padding: 10px 18px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #ffffff;
            border: 1.5px solid rgba(0, 242, 254, 0.6);
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            margin: 12px 0;
            border-radius: 12px;
            text-align: center;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-action:hover {
            border-color: var(--led-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
            transform: translateY(-2px);
            background: linear-gradient(135deg, #25334d, #14203a);
        }

        .btn-start-quiz {
            border-color: rgba(0, 255, 135, 0.6);
            box-shadow: 0 0 12px rgba(0, 255, 135, 0.2);
        }

        .btn-start-quiz:hover {
            border-color: var(--led-green);
            box-shadow: 0 0 20px rgba(0, 255, 135, 0.5);
        }

        .keypad-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px 0;
        }

        .keypad-grid {
            direction: ltr;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: rgba(15, 23, 42, 0.7);
            padding: 10px;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            width: 230px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .key-btn {
            background: linear-gradient(180deg, #1e293b 0%, #151e30 100%);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.1);
            height: 48px;
            font-size: 20px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: all 0.15s ease;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
        }

        .key-btn:hover {
            background: linear-gradient(180deg, #2b3952 0%, #1c273e 100%);
            border-color: rgba(0, 242, 254, 0.5);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
            color: var(--led-cyan);
            transform: translateY(-1px);
        }

        .key-btn.key-delete {
            background: linear-gradient(180deg, #3f1d28 0%, #29121a 100%);
            border-color: rgba(255, 51, 102, 0.4);
            color: #ff4d79;
        }

        .key-btn.key-clear {
            background: linear-gradient(180deg, #2d261a 0%, #1e1910 100%);
            border-color: rgba(255, 170, 0, 0.3);
            color: #ffb732;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 12px;
        }

        .timer-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2.5px solid var(--led-red);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            font-weight: 800;
            color: #ffffff;
            background: radial-gradient(circle, #2a111a 0%, #101626 100%);
            box-shadow: 0 0 14px rgba(255, 51, 102, 0.5);
            flex-shrink: 0;
            animation: timer-pulse 1s infinite alternate;
        }

        @keyframes timer-pulse {
            0% { box-shadow: 0 0 8px rgba(255, 51, 102, 0.4); }
            100% { box-shadow: 0 0 18px rgba(255, 51, 102, 0.8); }
        }

        .category-badge {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: #f8fafc;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.15);
            flex-shrink: 0;
        }

        .question-text {
            font-size: 17px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.6;
            margin-bottom: 14px;
            text-align: right;
            background: rgba(15, 23, 42, 0.85);
            padding: 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .question-image-container {
            width: 100%;
            text-align: center;
            margin-bottom: 14px;
            display: none;
        }

        .question-image {
            max-width: 100%;
            max-height: 180px;
            border-radius: 12px;
            border: 2px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
            object-fit: contain;
        }

        .numbers-wrap-container {
            width: 100%;
            margin-bottom: 16px;
        }

        .horizontal-wrap-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            direction: ltr;
        }

        .grid-item {
            width: 36px;
            height: 36px;
            background: #1e293b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-weight: 800;
            font-size: 13px;
            border: 2px solid transparent;
            transition: all 0.25s;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .grid-item.current {
            border-color: var(--led-cyan);
            color: #ffffff;
            background: #0f172a;
            transform: scale(1.15);
            box-shadow: 0 0 12px var(--led-cyan);
        }

        .grid-item.correct { background-color: #334155 !important; color: #e2e8f0 !important; }
        .grid-item.wrong { background-color: #334155 !important; color: #e2e8f0 !important; }

        .options-title {
            color: #94a3b8;
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .options-container-vertical {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
            width: 100%;
        }

        .option-btn {
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            color: #f1f5f9;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            padding: 13px 16px;
            border-radius: 12px;
            text-align: right;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
        }

        .option-btn:hover {
            background: rgba(45, 60, 85, 0.85);
            border-color: rgba(0, 242, 254, 0.4);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
            transform: translateX(-3px);
        }

        .option-btn.selected-correct, .option-btn.selected-wrong {
            background-color: #475569 !important;
            color: white !important;
        }

        .result-box {
            text-align: center;
            margin: auto 0;
            padding: 24px 15px;
        }

        .result-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .result-title.pass { color: #4ade80; text-shadow: 0 0 15px rgba(74, 222, 128, 0.4); }
        .result-title.fail { color: #f87171; text-shadow: 0 0 15px rgba(248, 113, 113, 0.4); }

        .score-badge {
            font-size: 32px;
            font-weight: 800;
            background: rgba(15, 23, 42, 0.9);
            padding: 16px 36px;
            border-radius: 18px;
            border: 2px solid rgba(0, 242, 254, 0.4);
            margin-bottom: 25px;
            display: inline-block;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
            color: #ffffff;
        }

        .footer-text {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            padding: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            margin-top: auto;
            background: rgba(11, 17, 32, 0.9);
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="app-led-wrapper">
    <div class="led-border-glow"></div>
    <div class="led-border-glow-extra"></div>

    <div class="app-container">
        <div class="led-runner-line"></div>

        <div class="app-header-bar">
            <span class="led-dot"></span>
            <div class="app-header-title" id="main-title">تاقیکردنەوەی تیۆری هاتووچۆ</div>
        </div>

        <div class="content-section" id="quiz-section">
            
            <div class="crash-spinner-section" id="crash-spinner" onclick="goToActivation()">
                <div class="spinner-container">
                    <div class="spinner-ring"></div>
                    <div class="spinner-ring"></div>
                    <div class="spinner-ring"></div>
                </div>
                <div class="crash-title">کراش</div>
            </div>

            <div class="activation-box" id="activation-gate">
                <div class="activation-icon-glow">🔒</div>
                <div class="activation-title" id="activation-title-text">ئەکتیڤکردنی سیستەم</div>
                <p class="activation-subtitle" id="activation-subtitle-text">تکایە کۆدی ئەکتیڤکردن بنووسە بۆ چوونەژوورەوە</p>

                <div class="activation-input-wrap">
                    <input autocomplete="off" id="activation-code-input" onkeypress="if(event.key === 'Enter') checkActivation();" placeholder="کۆدی ئەکتیڤ بنووسە" type="password">
                    <button class="toggle-pwd-btn" onclick="toggleActivationVisibility()" title="بینینی کۆد" type="button">👁️</button>
                </div>

                <div class="activation-msg" id="activation-msg"></div>

                <button class="btn-action btn-start-quiz" id="btn-activate" onclick="checkActivation()" style="width: 170px;" type="button">ئەکتیڤکردن</button>
            </div>

            <div class="language-selector" id="language-selector">
                <h2 id="lang-select-title">هەڵبژاردنی زمان / اختيار اللغة / Language</h2>
                <button class="language-btn" onclick="selectLanguage('ku')" type="button">
                    <span class="flag-icon">🟢☀️🔴</span>
                    <span>کوردی</span>
                </button>
                <button class="language-btn" onclick="selectLanguage('ar')" type="button">
                    <span class="flag-icon">🇮🇶</span>
                    <span>العربية</span>
                </button>
                <button class="language-btn" onclick="selectLanguage('en')" type="button">
                    <span class="flag-icon">🌐</span>
                    <span>English</span>
                </button>
            </div>

            <div class="login-box" id="login-box" style="display: none;">
                <div class="form-row">
                    <label for="form-number" id="label-form-number">ژمارەی فۆڕم</label>
                    <div class="input-wrapper">
                        <input autocomplete="off" id="form-number" inputmode="numeric" maxlength="15" placeholder="----" type="text">
                    </div>
                </div>
                
                <div class="form-row">
                    <label for="full-name" id="label-full-name">ناوی سیانی<span style="color:#ef4444;">*</span></label>
                    <div class="input-wrapper">
                        <input id="full-name" placeholder="ناوی بەشداربوو" readonly="readonly" type="text">
                    </div>
                </div>

                <button class="btn-action" id="btn-search" onclick="searchForm()" type="button">گەڕان</button>

                <div class="keypad-container">
                    <div class="keypad-grid">
                        <button class="key-btn" onclick="pressKey('1')" type="button">1</button>
                        <button class="key-btn" onclick="pressKey('2')" type="button">2</button>
                        <button class="key-btn" onclick="pressKey('3')" type="button">3</button>
                        <button class="key-btn" onclick="pressKey('4')" type="button">4</button>
                        <button class="key-btn" onclick="pressKey('5')" type="button">5</button>
                        <button class="key-btn" onclick="pressKey('6')" type="button">6</button>
                        <button class="key-btn" onclick="pressKey('7')" type="button">7</button>
                        <button class="key-btn" onclick="pressKey('8')" type="button">8</button>
                        <button class="key-btn" onclick="pressKey('9')" type="button">9</button>
                        <button class="key-btn key-clear" onclick="clearKey()" title="پاککردنەوەی هەمووی" type="button">C</button>
                        <button class="key-btn" onclick="pressKey('0')" type="button">0</button>
                        <button class="key-btn key-delete" onclick="deleteKey()" title="سڕینەوەی یەک ژمارە" type="button">⌫</button>
                    </div>
                </div>

                <button class="btn-action btn-start-quiz" id="btn-start-quiz" onclick="startQuiz()" type="button">تاقیکردنەوە</button>
            </div>

            <div id="quiz-box" style="display: none; flex-direction: column; flex: 1;">
                <div class="quiz-header">
                    <div class="category-badge">
                        <span class="led-dot"></span>
                        <span id="category-text">هاتووچۆ</span>
                    </div>
                    <div class="timer-circle" id="timer-display">1</div>
                </div>

                <div class="question-text" id="question-title">پرسیار ...</div>

                <div class="question-image-container" id="q-img-container">
                    <img alt="وێنەی پرسیار" class="question-image" id="q-img" src="">
                </div>

                <div class="numbers-wrap-container">
                    <div class="horizontal-wrap-list" id="grid-container"></div>
                </div>

                <div style="margin-top: auto;">
                    <p class="options-title" id="options-title-text">وەڵامەکان:</p>
                    <div class="options-container-vertical">
                        <button class="option-btn" onclick="selectAnswer(0)" type="button"><span id="opt0"></span></button>
                        <button class="option-btn" onclick="selectAnswer(1)" type="button"><span id="opt1"></span></button>
                        <button class="option-btn" onclick="selectAnswer(2)" type="button"><span id="opt2"></span></button>
                    </div>
                </div>
            </div>

            <div class="result-box" id="result-box" style="display: none;">
                <div class="result-title" id="result-msg"></div>
                <div class="score-badge" id="score-display">0 / 25</div>
                <br>
                <button class="btn-action" id="btn-restart" onclick="restartQuiz()" style="width: 220px;" type="button">دوبارە ئەنجامدانەوە</button>
            </div>

        </div>

        <div class="footer-text" id="footer-text">
            ئەم وێبسایتە لەلایەن محمد دروست کراوە مافی پارێزراوە 2026
        </div>
    </div>
</div>

<script>
    let currentLanguage = 'ku';

    const translations = {
        ku: {
            mainTitle: "تاقیکردنەوەی تیۆری هاتووجۆ",
            activationTitle: "ئەکتیڤکردنی سیستەم",
            activationSubtitle: "تکایە کۆدی ئەکتیڤکردن بنووسە بۆ چوونەژوورەوە",
            activationPlaceholder: "کۆدی ئەکتیڤ بنووسە",
            btnActivate: "ئەکتیڤکردن",
            activationSuccess: "ئەکتیڤ بوون بە سەرکەوتوی ئەنجامدرا",
            activationError: "کۆدی ئەکتیڤ بوون هەڵەیە",
            labelFormNumber: "ژمارەی فۆڕم",
            labelFullName: "ناوی سیانی",
            btnSearch: "گەڕان",
            btnStartQuiz: "تاقیکردنەوە",
            categoryText: "هاتووجۆ",
            optionsTitle: "وەڵامەکان:",
            btnRestart: "دوبارە ئەنجامدانەوە",
            footerText: "ئەم وێبسایتە لەلایەن محمد دروست کراوە مافی پارێزراوە 2026",
            resultPass: "بەڕێز ({name})، لە تاقیکردنەوەکە سەرکەوتوو بووی. 😊",
            resultFail: "بەڕێز ({name})، ببوورە، لە تاقیکردنەوەکە سەرکەوتوو نەبووی. 😭",
            alertFormError: "ژمارەی فۆڕم هەڵەیە! تکایە ژمارەی ڕاست بنووسە.",
            alertNameError: "تکایە سەرەتا بەستەری گەڕان دابگرە بۆ دەستکەوتنی ناو!",
            questionPrefix: "پرسیار "
        },
        ar: {
            mainTitle: "اختبار نظري المرور",
            activationTitle: "تفعيل النظام",
            activationSubtitle: "الرجاء إدخال رمز التفعيل للدخول",
            activationPlaceholder: "أدخل رمز التفعيل",
            btnActivate: "تفعيل",
            activationSuccess: "تم التفعيل بنجاح",
            activationError: "رمز التفعيل خاطئ",
            labelFormNumber: "رقم النموذج",
            labelFullName: "الاسم الثلاثي",
            btnSearch: "بحث",
            btnStartQuiz: "الاختبار",
            categoryText: "مرور",
            optionsTitle: "الإجابات:",
            btnRestart: "إعادة الاختبار",
            footerText: "تم تطوير هذا الموقع من قبل محمد - جميع الحقوق محفوظة 2026",
            resultPass: "سيدي/سيدتي ({name})، لقد نجحت في الاختبار. 😊",
            resultFail: "سيدي/سيدتي ({name})، عذراً، لم تنجح في الاختبار. 😭",
            alertFormError: "رقم النموذج خاطئ! الرجاء إدخال الرقم الصحيح.",
            alertNameError: "الرجاء الضغط على زر البحث أولاً للحصول على الاسم!",
            questionPrefix: "السؤال "
        },
        en: {
            mainTitle: "Traffic Theory Test",
            activationTitle: "System Activation",
            activationSubtitle: "Please enter the activation code to login",
            activationPlaceholder: "Enter activation code",
            btnActivate: "Activate",
            activationSuccess: "Activation successful",
            activationError: "Activation code is incorrect",
            labelFormNumber: "Form Number",
            labelFullName: "Full Name",
            btnSearch: "Search",
            btnStartQuiz: "Start Test",
            categoryText: "Traffic",
            optionsTitle: "Answers:",
            btnRestart: "Restart Test",
            footerText: "This website was developed by Mohammed - All rights reserved 2026",
            resultPass: "Dear ({name}), you have passed the test. 😊",
            resultFail: "Dear ({name}), sorry, you did not pass the test. 😭",
            alertFormError: "Form number is incorrect! Please enter the correct number.",
            alertNameError: "Please press the search button first to get the name!",
            questionPrefix: "Question "
        }
    };

    function goToActivation() {
        document.getElementById('crash-spinner').style.display = 'none';
        document.getElementById('activation-gate').style.display = 'flex';
    }

    function selectLanguage(lang) {
        currentLanguage = lang;
        document.documentElement.setAttribute('lang', lang);
        
        if(lang === 'ar' || lang === 'ku') {
            document.body.style.direction = 'rtl';
            document.querySelectorAll('.option-btn').forEach(btn => btn.style.textAlign = 'right');
            document.querySelectorAll('.question-text').forEach(el => el.style.textAlign = 'right');
        } else {
            document.body.style.direction = 'ltr';
            document.querySelectorAll('.option-btn').forEach(btn => btn.style.textAlign = 'left');
            document.querySelectorAll('.question-text').forEach(el => el.style.textAlign = 'left');
        }

        updateUIText();
        document.getElementById('language-selector').style.display = 'none';
        document.getElementById('login-box').style.display = 'flex';
    }

    function updateUIText() {
        const t = translations[currentLanguage];
        document.getElementById('main-title').innerText = t.mainTitle;
        document.getElementById('activation-title-text').innerText = t.activationTitle;
        document.getElementById('activation-subtitle-text').innerText = t.activationSubtitle;
        document.getElementById('activation-code-input').placeholder = t.activationPlaceholder;
        document.getElementById('btn-activate').innerText = t.btnActivate;
        document.getElementById('label-form-number').innerHTML = t.labelFormNumber;
        document.getElementById('label-full-name').innerHTML = t.labelFullName + '<span style="color:#ef4444;">*</span>';
        document.getElementById('btn-search').innerText = t.btnSearch;
        document.getElementById('btn-start-quiz').innerText = t.btnStartQuiz;
        document.getElementById('category-text').innerText = t.categoryText;
        document.getElementById('options-title-text').innerText = t.optionsTitle;
        document.getElementById('btn-restart').innerText = t.btnRestart;
        document.getElementById('footer-text').innerText = t.footerText;
    }

    const questionsBase = [
        {
            q: "ئەم هێمایە مانای چییە؟",
            qAr: "ماذا تعني هذه العلامة؟",
            qEn: "What does this sign mean?",
            image: "https://www.image2url.com/r2/default/images/1790604193512-667487b5-4817-4324-9d49-9e94ef6437ff.jpg",
            options: ["A) ناوچەی نیشتەجێبوون دەست پێدەکات", "B) ڕێگای خێرا دەست پێدەکات", "C) ڕێگای خێرا کۆتایی دێت"],
            optionsAr: ["أ) تبدأ منطقة سكنية", "ب) يبدأ طريق سريع", "ج) ينتهي الطريق السريع"],
            optionsEn: ["A) Residential area begins", "B) Highway begins", "C) Highway ends"],
            correct: 2
        },
        {
            q: "ئەم هێمایە مانای چییە؟",
            qAr: "ماذا تعني هذه العلامة؟",
            qEn: "What does this sign mean?",
            image: "https://www.image2url.com/r2/default/images/1790604620428-4e3e68ff-ae56-4d75-94a5-f7c6a0f5cacd.jpg",
            options: ["A) لە پێش ئەم تابلۆیەوە وەستان و پارککردن قەدەغەیە", "B) لە پشتی ئەم تابلۆیەوە وەستان و پارککردن قەدەغەیە", "C) لە پێش و پشتی ئەم تابلۆیەوە وەستان و پارککردن قەدەغەیە"],
            optionsAr: ["أ) يمنع الوقوف والركن أمام هذه اللوحة", "ب) يمنع الوقوف والركن خلف هذه اللوحة", "ج) يمنع الوقوف والركن أمام وخلف هذه اللوحة"],
            optionsEn: ["A) No stopping and parking in front of this sign", "B) No stopping and parking behind this sign", "C) No stopping and parking in front of and behind this sign"],
            correct: 2
        },
        {
            q: "ئەم هێمایە لە ناو داشبۆرد مانای چییە؟",
            qAr: "ماذا تعني هذه العلامة في لوحة القيادة؟",
            qEn: "What does this sign mean on the dashboard?",
            image: "https://www.image2url.com/r2/default/images/1790604837514-c74175fc-fa7e-49aa-9bf2-f27077242007.webp",
            options: ["A) بەرزبوونەوەی پلەی گەرمیی بزوێنەر (حەماوە)", "B) پشتێنی سەلامەتی ببەستە", "C) کێشە لە ڕۆنی بزوێنەر هەیە"],
            optionsAr: ["أ) ارتفاع درجة حرارة المحرك", "ب) ربط حزام الأمان", "ج) مشكلة في زيت المحرك"],
            optionsEn: ["A) Engine temperature rising", "B) Fasten seatbelt", "C) Engine oil problem"],
            correct: 0
        }
    ];

    let questions = [];
    let currentQ = 0;
    let userName = "";
    let userAnswers = new Array(25).fill(null);
    let timer;
    let timeLeft = 1;

    function shuffleQuestions() {
        questions = JSON.parse(JSON.stringify(questionsBase));
        for (let i = questions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [questions[i], questions[j]] = [questions[j], questions[i]];
        }
    }

    function checkActivation() {
        const input = document.getElementById('activation-code-input');
        const msg = document.getElementById('activation-msg');
        const code = input.value.trim();
        const t = translations[currentLanguage];

        if (code === "22@@99") {
            msg.className = "activation-msg success";
            msg.innerText = t.activationSuccess;
            document.getElementById('form-number').value = '';
            document.getElementById('full-name').value = '';

            setTimeout(() => {
                document.getElementById('activation-gate').style.display = 'none';
                document.getElementById('language-selector').style.display = 'flex';
            }, 800);
        } else {
            msg.className = "activation-msg error";
            msg.innerText = t.activationError;
        }
    }

    function toggleActivationVisibility() {
        const input = document.getElementById('activation-code-input');
        input.type = input.type === "password" ? "text" : "password";
    }

    function pressKey(val) { document.getElementById('form-number').value += val; }
    function deleteKey() { const input = document.getElementById('form-number'); input.value = input.value.slice(0, -1); }
    function clearKey() { document.getElementById('form-number').value = ''; }

    const studentForms = {
        "2026": "نوسینگەی شوفێری مەهتاب",
        "95577": "دنیا محمد قادر",
        "94097": "ایرج نجف کیامینش",
        "92651": "ئاسۆ اسکندر رحمان",
        "94411": "محمد عمر جلال"
    };

    function searchForm() {
        const t = translations[currentLanguage];
        let formNum = document.getElementById('form-number').value.trim();
        if(studentForms[formNum]) {
            document.getElementById('full-name').value = studentForms[formNum];
        } else {
            alert(t.alertFormError);
        }
    }

    function initGrid() {
        const grid = document.getElementById('grid-container');
        grid.innerHTML = '';
        for(let i = 1; i <= 25; i++) {
            const item = document.createElement('div');
            item.className = 'grid-item';
            item.id = 'grid-' + (i - 1);
            item.innerText = i;
            grid.appendChild(item);
        }
    }

    function startQuiz() {
        const t = translations[currentLanguage];
        const nameInput = document.getElementById('full-name').value.trim();
        if(!nameInput) {
            alert(t.alertNameError);
            return;
        }
        userName = nameInput;
        shuffleQuestions();
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('quiz-box').style.display = 'flex';
        initGrid();
        loadQuestion(0);
    }

    function startTimer() {
        clearInterval(timer);
        timeLeft = 1;
        document.getElementById('timer-display').innerText = timeLeft;
        timer = setInterval(() => {
            timeLeft++;
            if(timeLeft > 60) {
                clearInterval(timer);
                selectAnswer(-1);
            } else {
                document.getElementById('timer-display').innerText = timeLeft;
            }
        }, 1000);
    }

    function loadQuestion(index) {
        currentQ = index;
        const qData = questions[index % questions.length];
        const t = translations[currentLanguage];

        let questionText = qData.q;
        let optionsArray = qData.options;
        
        if(currentLanguage === 'ar') {
            questionText = qData.qAr || qData.q;
            optionsArray = qData.optionsAr || qData.options;
        } else if(currentLanguage === 'en') {
            questionText = qData.qEn || qData.q;
            optionsArray = qData.optionsEn || qData.options;
        }

        document.getElementById('question-title').innerText = t.questionPrefix + (index + 1) + ": " + questionText;

        const imgContainer = document.getElementById('q-img-container');
        const imgEl = document.getElementById('q-img');
        if(qData.image) {
            imgEl.src = qData.image;
            imgContainer.style.display = 'block';
        } else {
            imgContainer.style.display = 'none';
            imgEl.src = '';
        }

        document.getElementById('opt0').innerText = optionsArray[0];
        document.getElementById('opt1').innerText = optionsArray[1];
        document.getElementById('opt2').innerText = optionsArray[2];

        document.querySelectorAll('.option-btn').forEach(btn => btn.className = 'option-btn');

        for(let i = 0; i < 25; i++) {
            const gridEl = document.getElementById('grid-' + i);
            if(i === index) gridEl.classList.add('current');
            else gridEl.classList.remove('current');
        }

        startTimer();
    }

    function selectAnswer(optionIndex) {
        clearInterval(timer);
        const qData = questions[currentQ % questions.length];
        const gridEl = document.getElementById('grid-' + currentQ);

        const isCorrect = (optionIndex === qData.correct);
        userAnswers[currentQ] = isCorrect;

        if(isCorrect) gridEl.classList.add('correct');
        else gridEl.classList.add('wrong');

        const btns = document.querySelectorAll('.option-btn');
        if(optionIndex >= 0 && optionIndex < 3) {
            if(isCorrect) btns[optionIndex].classList.add('selected-correct');
            else btns[optionIndex].classList.add('selected-wrong');
        }

        setTimeout(() => {
            if(currentQ < 24) {
                loadQuestion(currentQ + 1);
            } else {
                showResults();
            }
        }, 400);
    }

    function showResults() {
        document.getElementById('quiz-box').style.display = 'none';
        document.getElementById('result-box').style.display = 'block';

        let correctCount = userAnswers.filter(ans => ans === true).length;
        let wrongCount = 25 - correctCount;

        const msgEl = document.getElementById('result-msg');
        const scoreEl = document.getElementById('score-display');
        const t = translations[currentLanguage];

        scoreEl.innerText = correctCount + " / 25";

        if(wrongCount <= 5) {
            msgEl.className = 'result-title pass';
            msgEl.innerText = t.resultPass.replace('{name}', userName);
        } else {
            msgEl.className = 'result-title fail';
            msgEl.innerText = t.resultFail.replace('{name}', userName);
        }
    }

    function restartQuiz() {
        currentQ = 0;
        userAnswers = new Array(25).fill(null);
        document.getElementById('result-box').style.display = 'none';
        document.getElementById('login-box').style.display = 'flex';
        document.getElementById('form-number').value = '';
        document.getElementById('full-name').value = '';
    }
</script>

</body>
</html>
