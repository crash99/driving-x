<!DOCTYPE html>
<html b:css='false' dir='rtl' lang='ku' xmlns='http://www.w3.org/1999/xhtml' xmlns:b='http://www.google.com/2005/gml/b' xmlns:data='http://www.google.com/2005/gml/data' xmlns:expr='http://www.google.com/2005/gml/expr'>
<head>
    <meta charset='UTF-8'/>
    <meta content='width=device-width, initial-scale=1.0' name='viewport'/>
    <title>تاقیکردنەوەی تیۆری هاتووچۆ</title>
    
    <link href='https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&amp;display=swap' rel='stylesheet'/>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --led-cyan: #00f2fe;
            --led-blue: #4facfe;
            --led-pink: #ff007f;
            --led-green: #00ff87;
            --led-amber: #ffaa00;
            --led-red: #ff3366;
            --bg-dark: #080c14;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(0, 242, 254, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 90%, rgba(255, 0, 127, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(0, 255, 135, 0.05) 0%, transparent 40%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            direction: rtl;
            overflow-x: hidden;
        }

        .app-led-wrapper {
            position: relative;
            width: 100%;
            max-width: 540px;
            border-radius: 26px;
            padding: 3.5px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.25), 0 25px 60px -15px rgba(0, 0, 0, 0.9);
            margin: auto;
        }

        .led-border-glow {
            position: absolute;
            width: 250%;
            height: 250%;
            top: -75%;
            left: -75%;
            background: conic-gradient(from 0deg, var(--led-cyan), var(--led-blue), var(--led-pink), var(--led-amber), var(--led-green), var(--led-cyan));
            animation: rotate-led 4s linear infinite;
            z-index: 1;
            filter: blur(5px);
        }

        .led-border-glow-extra {
            position: absolute;
            width: 250%;
            height: 250%;
            top: -75%;
            left: -75%;
            background: conic-gradient(from 180deg, var(--led-pink), var(--led-cyan), var(--led-green), var(--led-amber), var(--led-blue), var(--led-pink));
            animation: rotate-led 6s linear infinite reverse;
            z-index: 1;
            filter: blur(14px);
            opacity: 0.65;
        }

        @keyframes rotate-led {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .app-container {
            width: 100%;
            background: #0e1628;
            border-radius: 23px;
            overflow: hidden;
            position: relative;
            z-index: 2;
            min-height: 560px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .led-runner-line {
            height: 3px;
            width: 100%;
            background: linear-gradient(90deg, transparent, var(--led-cyan), var(--led-pink), var(--led-green), transparent);
            background-size: 200% 100%;
            animation: runner-move 3s ease infinite;
        }

        @keyframes runner-move {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        .app-header-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: rgba(11, 17, 32, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid rgba(255, 255, 255, 0.06);
            padding: 16px;
            position: relative;
        }

        .app-header-title {
            color: #ffffff;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .content-section {
            padding: 24px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .crash-spinner-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto 0;
            width: 100%;
            gap: 25px;
            padding: 30px 0;
            cursor: pointer;
        }

        .spinner-container {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .spinner-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid transparent;
            border-top-color: var(--led-cyan);
            border-right-color: var(--led-pink);
            animation: spin-ring 2s linear infinite;
        }

        .spinner-ring:nth-child(2) {
            width: 85%;
            height: 85%;
            top: 7.5%;
            left: 7.5%;
            border-top-color: var(--led-green);
            border-right-color: var(--led-amber);
            animation: spin-ring 1.5s linear infinite reverse;
        }

        .spinner-ring:nth-child(3) {
            width: 70%;
            height: 70%;
            top: 15%;
            left: 15%;
            border-top-color: var(--led-blue);
            border-right-color: var(--led-red);
            animation: spin-ring 2.5s linear infinite;
        }

        @keyframes spin-ring {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .crash-title {
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(90deg, var(--led-cyan), var(--led-pink), var(--led-green), var(--led-cyan));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 3s linear infinite, glow-pulse 2s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.5);
            letter-spacing: 8px;
            position: relative;
        }

        @keyframes gradient-shift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        @keyframes glow-pulse {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 10px rgba(0, 242, 254, 0.6)); }
            50% { filter: brightness(1.3) drop-shadow(0 0 25px rgba(255, 0, 127, 0.8)); }
        }

        .activation-box {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto 0;
            width: 100%;
            text-align: center;
            padding: 10px 0;
        }

        .activation-icon-glow {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.2) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 2px solid var(--led-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 16px;
        }

        .activation-title {
            font-size: 21px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #ffffff, var(--led-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .activation-subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 22px; font-weight: 500; }
        .activation-input-wrap { position: relative; width: 100%; max-width: 300px; margin-bottom: 12px; }
        .activation-input-wrap input {
            width: 100%; padding: 12px 42px 12px 14px; border: 1.5px solid rgba(0, 242, 254, 0.4);
            border-radius: 12px; font-size: 17px; font-weight: 700; text-align: center;
            background: rgba(15, 23, 42, 0.9); color: #ffffff; outline: none; direction: ltr;
        }
        .toggle-pwd-btn { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: #94a3b8; cursor: pointer; font-size: 17px; }

        .activation-msg {
            width: 100%; max-width: 300px; min-height: 28px; font-size: 14px; font-weight: 700;
            padding: 8px 12px; border-radius: 8px; margin-bottom: 14px; display: none;
        }
        .activation-msg.error { display: block; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #f87171; }
        .activation-msg.success { display: block; background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #34d399; }

        .language-selector {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            margin: auto 0; width: 100%; text-align: center; padding: 20px 0; gap: 18px;
        }
        .language-btn {
            width: 100%; max-width: 320px; padding: 16px 24px; background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #ffffff; border: 2px solid rgba(0, 242, 254, 0.5); font-size: 18px; font-weight: 800;
            cursor: pointer; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        .flag-icon { font-size: 28px; line-height: 1; }

        .led-dot {
            width: 9px; height: 9px; background-color: var(--led-green); border-radius: 50%;
            display: inline-block; box-shadow: 0 0 10px var(--led-green);
        }

        .login-box { display: none; flex-direction: column; align-items: center; justify-content: center; margin: auto 0; width: 100%; }
        .form-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; width: 100%; max-width: 340px; }
        .form-row label { font-size: 15px; font-weight: 700; color: #f1f5f9; width: 110px; text-align: right; }
        .input-wrapper { flex: 1; position: relative; display: flex; align-items: center; }
        .form-row input {
            width: 100%; padding: 10px 14px; border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px; font-size: 16px; font-weight: 700; text-align: center;
            background: rgba(15, 23, 42, 0.85); color: #ffffff; outline: none;
        }
        #form-number { direction: ltr; }
        .form-row input[readonly] { background: rgba(30, 41, 59, 0.6); color: #38bdf8; }

        .btn-action {
            width: 160px; padding: 10px 18px; background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #ffffff; border: 1.5px solid rgba(0, 242, 254, 0.6); font-size: 17px; font-weight: 800;
            cursor: pointer; margin: 12px 0; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-start-quiz { border-color: rgba(0, 255, 135, 0.6); }

        .keypad-container { display: flex; flex-direction: column; align-items: center; margin: 10px 0; }
        .keypad-grid {
            direction: ltr; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
            background: rgba(15, 23, 42, 0.7); padding: 10px; border: 1.5px solid rgba(255, 255, 255, 0.08);
            width: 230px; border-radius: 16px;
        }
        .key-btn {
            background: linear-gradient(180deg, #1e293b 0%, #151e30 100%); color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.1); height: 48px; font-size: 20px; font-weight: 800;
            border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; }
        .timer-circle {
            width: 52px; height: 52px; border-radius: 50%; border: 2.5px solid var(--led-red);
            display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 800; color: #ffffff;
            background: radial-gradient(circle, #2a111a 0%, #101626 100%);
        }
        .category-badge {
            background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(0, 242, 254, 0.3); color: #f8fafc;
            padding: 7px 16px; border-radius: 20px; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px;
        }
        .question-text {
            font-size: 17px; font-weight: 800; color: #ffffff; line-height: 1.6; margin-bottom: 14px;
            text-align: right; background: rgba(15, 23, 42, 0.85); padding: 16px; border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .question-image-container { width: 100%; text-align: center; margin-bottom: 14px; display: none; }
        .question-image { max-width: 100%; max-height: 180px; border-radius: 12px; border: 2px solid rgba(0, 242, 254, 0.3); object-fit: contain; }

        .numbers-wrap-container { width: 100%; margin-bottom: 16px; }
        .horizontal-wrap-list { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; direction: ltr; }
        .grid-item {
            width: 36px; height: 36px; background: #1e293b; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: #94a3b8; font-weight: 800; font-size: 13px;
        }
        .grid-item.current { border-color: var(--led-cyan); color: #ffffff; background: #0f172a; transform: scale(1.15); }
        .grid-item.correct, .grid-item.wrong { background-color: #334155 !important; color: #e2e8f0 !important; }

        .options-title { color: #94a3b8; font-weight: 700; margin-bottom: 10px; font-size: 14px; }
        .options-container-vertical { display: flex; flex-direction: column; gap: 10px; margin-top: auto; width: 100%; }
        .option-btn {
            width: 100%; background: rgba(30, 41, 59, 0.7); color: #f1f5f9;
            border: 1.5px solid rgba(255, 255, 255, 0.08); padding: 13px 16px; border-radius: 12px;
            text-align: right; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center;
        }
        .option-btn.selected-correct, .option-btn.selected-wrong { background-color: #475569 !important; color: white !important; }

        .result-box { text-align: center; margin: auto 0; padding: 24px 15px; }
        .result-title { font-size: 22px; font-weight: 800; margin-bottom: 16px; line-height: 1.6; }
        .result-title.pass { color: #4ade80; }
        .result-title.fail { color: #f87171; }
        .score-badge {
            font-size: 32px; font-weight: 800; background: rgba(15, 23, 42, 0.9);
            padding: 16px 36px; border-radius: 18px; border: 2px solid rgba(0, 242, 254, 0.4);
            margin-bottom: 25px; display: inline-block; color: #ffffff;
        }

        .footer-text {
            text-align: center; font-size: 13px; color: #94a3b8; padding: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06); margin-top: auto; background: rgba(11, 17, 32, 0.9); font-weight: 600;
        }
    </style>
</head>
<body>

<div class='app-led-wrapper'>
    <div class='led-border-glow'></div>
    <div class='led-border-glow-extra'></div>

    <div class='app-container'>
        <div class='led-runner-line'></div>

        <div class='app-header-bar'>
            <span class='led-dot'></span>
            <div class='app-header-title' id='main-title'>تاقیکردنەوەی تیۆری هاتووچۆ</div>
        </div>

        <div class='content-section' id='quiz-section'>
            
            <div class='crash-spinner-section' id='crash-spinner' onclick='goToActivation()'>
                <div class='spinner-container'>
                    <div class='spinner-ring'></div>
                    <div class='spinner-ring'></div>
                    <div class='spinner-ring'></div>
                </div>
                <div class='crash-title'>کراش</div>
            </div>

            <div class='activation-box' id='activation-gate'>
                <div class='activation-icon-glow'>🔒</div>
                <div class='activation-title' id='activation-title-text'>ئەکتیڤکردنی سیستەم</div>
                <p class='activation-subtitle' id='activation-subtitle-text'>تکایە کۆدی ئەکتیڤکردن بنووسە بۆ چوونەژوورەوە</p>

                <div class='activation-input-wrap'>
                    <input autocomplete='off' id='activation-code-input' onkeypress='if(event.key === &quot;Enter&quot;) checkActivation();' placeholder='کۆدی ئەکتیڤ بنووسە' type='password'/>
                    <button class='toggle-pwd-btn' onclick='toggleActivationVisibility()' title='بینینی کۆد' type='button'>👁️</button>
                </div>

                <div class='activation-msg' id='activation-msg'></div>

                <button class='btn-action btn-start-quiz' id='btn-activate' onclick='checkActivation()' style='width: 170px;' type='button'>ئەکتیڤکردن</button>
            </div>

            <div class='language-selector' id='language-selector'>
                <h2 id='lang-select-title'>هەڵبژاردنی زمان / اختيار اللغة / Language</h2>
                <button class='language-btn' onclick='selectLanguage(&quot;ku&quot;)' type='button'>
                    <span class='flag-icon'>🟢☀️🔴</span>
                    <span>کوردی</span>
                </button>
                <button class='language-btn' onclick='selectLanguage(&quot;ar&quot;)' type='button'>
                    <span class='flag-icon'>🇮🇶</span>
                    <span>العربية</span>
                </button>
                <button class='language-btn' onclick='selectLanguage(&quot;en&quot;)' type='button'>
                    <span class='flag-icon'>🌐</span>
                    <span>English</span>
                </button>
            </div>

            <div class='login-box' id='login-box' style='display: none;'>
                <div class='form-row'>
                    <label for='form-number' id='label-form-number'>ژمارەی فۆڕم</label>
                    <div class='input-wrapper'>
                        <input autocomplete='off' id='form-number' inputmode='numeric' maxlength='15' placeholder='----' type='text'/>
                    </div>
                </div>
                
                <div class='form-row'>
                    <label for='full-name' id='label-full-name'>ناوی سیانی<span style='color:#ef4444;'>*</span></label>
                    <div class='input-wrapper'>
                        <input id='full-name' placeholder='ناوی بەشداربوو' readonly='readonly' type='text'/>
                    </div>
                </div>

                <button class='btn-action' id='btn-search' onclick='searchForm()' type='button'>گەڕان</button>

                <div class='keypad-container'>
                    <div class='keypad-grid'>
                        <button class='key-btn' onclick='pressKey(&quot;1&quot;)' type='button'>1</button>
                        <button class='key-btn' onclick='pressKey(&quot;2&quot;)' type='button'>2</button>
                        <button class='key-btn' onclick='pressKey(&quot;3&quot;)' type='button'>3</button>
                        <button class='key-btn' onclick='pressKey(&quot;4&quot;)' type='button'>4</button>
                        <button class='key-btn' onclick='pressKey(&quot;5&quot;)' type='button'>5</button>
                        <button class='key-btn' onclick='pressKey(&quot;6&quot;)' type='button'>6</button>
                        <button class='key-btn' onclick='pressKey(&quot;7&quot;)' type='button'>7</button>
                        <button class='key-btn' onclick='pressKey(&quot;8&quot;)' type='button'>8</button>
                        <button class='key-btn' onclick='pressKey(&quot;9&quot;)' type='button'>9</button>
                        <button class='key-btn key-clear' onclick='clearKey()' title='پاککردنەوەی هەمووی' type='button'>C</button>
                        <button class='key-btn' onclick='pressKey(&quot;0&quot;)' type='button'>0</button>
                        <button class='key-btn key-delete' onclick='deleteKey()' title='سڕینەوەی یەک ژمارە' type='button'>⌫</button>
                    </div>
                </div>

                <button class='btn-action btn-start-quiz' id='btn-start-quiz' onclick='startQuiz()' type='button'>تاقیکردنەوە</button>
            </div>

            <div id='quiz-box' style='display: none; flex-direction: column; flex: 1;'>
                <div class='quiz-header'>
                    <div class='category-badge'>
                        <span class='led-dot'></span>
                        <span id='category-text'>هاتووچۆ</span>
                    </div>
                    <div class='timer-circle' id='timer-display'>1</div>
                </div>

                <div class='question-text' id='question-title'>پرسیار ...</div>

                <div class='question-image-container' id='q-img-container'>
                    <img alt='وێنەی پرسیار' class='question-image' id='q-img' src=''/>
                </div>

                <div class='numbers-wrap-container'>
                    <div class='horizontal-wrap-list' id='grid-container'></div>
                </div>

                <div style='margin-top: auto;'>
                    <p class='options-title' id='options-title-text'>وەڵامەکان:</p>
                    <div class='options-container-vertical'>
                        <button class='option-btn' onclick='selectAnswer(0)' type='button'><span id='opt0'></span></button>
                        <button class='option-btn' onclick='selectAnswer(1)' type='button'><span id='opt1'></span></button>
                        <button class='option-btn' onclick='selectAnswer(2)' type='button'><span id='opt2'></span></button>
                    </div>
                </div>
            </div>

            <div class='result-box' id='result-box' style='display: none;'>
                <div class='result-title' id='result-msg'></div>
                <div class='score-badge' id='score-display'>0 / 25</div>
                <br/>
                <button class='btn-action' id='btn-restart' onclick='restartQuiz()' style='width: 220px;' type='button'>دوبارە ئەنجامدانەوە</button>
            </div>

        </div>

        <div class='footer-text' id='footer-text'>
            ئەم وێبسایتە لەلایەن محمد دروست کراوە مافی پارێزراوە 2026
        </div>
    </div>
</div>

<script>
//<![CDATA[
    let currentLanguage = 'ku';

    const translations = {
        ku: {
            mainTitle: "تاقیکردنەوەی تیۆری هاتووجۆ",
            activationTitle: "ئەکتیڤکردنی سیستەم",
            activationSubtitle: "تکایە کۆدی ئەکتیڤکردن بنووسە بۆ چوونەژوورەوە",
            activationPlaceholder: "کۆدی ئەکتیڤ بنووسە",
            btnActivate: "ئەکتیڤکردن",
            activationSuccess: "ئەکتیڤ بوون بە سەرکەوتوی ئەنجامدرا",
            activationError: "کۆدی ئەکتیڤ بوون هەڵەیە",
            labelFormNumber: "ژمارەی فۆڕم",
            labelFullName: "ناوی سیانی",
            btnSearch: "گەڕان",
            btnStartQuiz: "تاقیکردنەوە",
            categoryText: "هاتووجۆ",
            optionsTitle: "وەڵامەکان:",
            btnRestart: "دوبارە ئەنجامدانەوە",

        currentQ = index;
        const qData = questions[index % questions.length];
        const t = translations[currentLanguage];

        let questionText = qData.q;
        let optionsArray = qData.options;
        
        if(currentLanguage === 'ar') {
            questionText = qData.qAr || qData.q;
            optionsArray = qData.optionsAr || qData.options;

            const gridEl = document.getElementById('grid-' + i);
            if(i === index) gridEl.classList.add('current');

    function msg(text, ok) {
        var m = $('adm-msg');
        if (!m) return;
        m.className = 'adm-msg ' + (ok ? 'ok' : 'err');
        m.textContent = text;
        m.style.display = 'block';
    }

    function showLogin() {
        setTitle('ژووری بەڕێوبەر');
        $('adm-body').innerHTML =
            '<div class="adm-pad">' +
            '<div class="adm-field"><label>ناوی بەکارهێنەر</label><input class="adm-in adm-ltr" id="adm-user" autocomplete="off"/></div>' +
            '<div class="adm-field"><label>پاسۆرد</label><div style="position:relative"><input class="adm-in adm-ltr" id="adm-pass" type="password" autocomplete="off" style="padding-left:38px"/>' +
            '<button type="button" class="adm-eye" id="adm-eye">👁️</button></div></div>' +
            '<div class="adm-msg" id="adm-msg"></div>' +
            '<div class="adm-row" style="justify-content:space-between"><button type="button" class="adm-btn" id="adm-login">چوونەژوورەوە</button>' +
            '<button type="button" class="adm-link" id="adm-forgot">پاسۆردم لەبیرچووە؟</button></div></div>';
        
        $('adm-eye').addEventListener('click', function () {
            var p = $('adm-pass'); p.type = (p.type === 'password') ? 'text' : 'password';
        });
        $('adm-login').addEventListener('click', doLogin);
        $('adm-forgot').addEventListener('click', showForgot);
        $('adm-user.focus');
    }

    function doLogin() {
        var u = $('adm-user').value.trim();
        var p = $('adm-pass').value;
        if (!u || !p) { msg('ناوی بەکارهێنەر و پاسۆرد بنووسە', false); return; }
        
        hashPass(p).then(function (h) {
            if (u === CFG.ADMIN_USER && h === CFG.ADMIN_PASS_HASH) {
                msg('بە سەرکەوتوویی چوویە ژوورەوە!', true);
                setTimeout(function () { closeAdmin(); alert('بەڕێوبەر: لێرەدا دەتوانیت کۆنتڕۆڵی سیستەم بکەیت.'); }, 800);
            } else {
                msg('ناوی بەکارهێنەر یان پاسۆرد هەڵەیە', false);
            }
        });
    }

    function showForgot() {
        setTitle('گۆڕینی پاسۆرد');
        $('adm-body').innerHTML =
            '<div class="adm-pad"><p class="adm-hint">تکایە ئیمەیڵی بەڕێوبەر بنووسە بۆ ناردنی کۆدی گۆڕینی پاسۆرد:</p>' +
            '<div class="adm-field"><label>ئیمەیڵ</label><input class="adm-in adm-ltr" id="forgot-email" value="' + esc(CFG.ADMIN_EMAIL) + '"/></div>' +
            '<div class="adm-msg" id="adm-msg"></div>' +
            '<div class="adm-row" style="justify-content:space-between"><button type="button" class="adm-btn green" id="adm-send">ناردنی کۆد</button>' +
            '<button type="button" class="adm-link" id="adm-back">گەڕانەوە</button></div></div>';
        
        $('adm-send').addEventListener('click', function() {
            msg('کۆدی گۆڕینی پاسۆرد بە سەرکەوتوویی نێردرا بۆ ئیمەیڵەکەت!', true);
        });
        $('adm-back').addEventListener('click', showLogin);
    }

    function initAdmin() {
        var hdr = document.querySelector('.app-header-bar');
        if (hdr) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'adm-gear';
            b.title = 'ژووری بەڕێوبەر';
            b.textContent = '⚙️';
            hdr.appendChild(b);
            b.addEventListener('click', openAdmin);
        }
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initAdmin);
    else initAdmin();

})();
//]]>
</script>
<!-- ===================== ژووری بەڕێوبەر (Admin Room) : کۆتایی ===================== -->

</body>
</html>
