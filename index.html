<!DOCTYPE html>
<html b:css='false' dir='rtl' lang='ku' xmlns='http://www.w3.org/1999/xhtml' xmlns:b='http://www.google.com/2005/gml/b' xmlns:data='http://www.google.com/2005/gml/data' xmlns:expr='http://www.google.com/2005/gml/expr'>
<head>
    <meta charset='UTF-8'/>
    <meta content='width=device-width, initial-scale=1.0' name='viewport'/>
    <title><data:blog.pageTitle/></title>

<b:skin><![CDATA[
      .cookie-choices-info { display: none !important; }
    ]]></b:skin>
    
    <link href='https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&amp;display=swap' rel='stylesheet'/>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: &#39;Vazirmatn&#39;, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

:root {
            --led-cyan: #00f2fe;
            --led-blue: #4facfe;
            --led-pink: #ff007f;
            --led-green: #00ff87;
            --led-amber: #ffaa00;
            --led-red: #ff3366;
            --bg-dark: #080c14;
        }

body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(0, 242, 254, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 90%, rgba(255, 0, 127, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(0, 255, 135, 0.05) 0%, transparent 40%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            direction: rtl;
            overflow-x: hidden;
        }

/* چێوەی لیدی جوڵاو (Moving Animated LED Border) */
        .app-led-wrapper {
            position: relative;
            width: 100%;
            max-width: 540px;
            border-radius: 26px;
            padding: 3.5px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.25), 0 25px 60px -15px rgba(0, 0, 0, 0.9);
            margin: auto;
        }

.led-border-glow {
            position: absolute;
            width: 250%;
            height: 250%;
            top: -75%;
            left: -75%;
            background: conic-gradient(
                from 0deg,
                var(--led-cyan),
                var(--led-blue),
                var(--led-pink),
                var(--led-amber),
                var(--led-green),
                var(--led-cyan)
            );
            animation: rotate-led 4s linear infinite;
            z-index: 1;
            filter: blur(5px);
        }

.led-border-glow-extra {
            position: absolute;
            width: 250%;
            height: 250%;
            top: -75%;
            left: -75%;
            background: conic-gradient(
                from 180deg,
                var(--led-pink),
                var(--led-cyan),
                var(--led-green),
                var(--led-amber),
                var(--led-blue),
                var(--led-pink)
            );
            animation: rotate-led 6s linear infinite reverse;
            z-index: 1;
            filter: blur(14px);
            opacity: 0.65;
        }

@keyframes rotate-led {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

/* دەفری ناوەوەی ئەپڵیکەیشن */
        .app-container {
            width: 100%;
            background: #0e1628;
            border-radius: 23px;
            overflow: hidden;
            position: relative;
            z-index: 2;
            min-height: 560px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

/* هێڵی لیدی سەرەوە */
        .led-runner-line {
            height: 3px;
            width: 100%;
            background: linear-gradient(90deg, transparent, var(--led-cyan), var(--led-pink), var(--led-green), transparent);
            background-size: 200% 100%;
            animation: runner-move 3s ease infinite;
        }

@keyframes runner-move {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

/* بەشی سەردێڕ */
        .app-header-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: rgba(11, 17, 32, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid rgba(255, 255, 255, 0.06);
            padding: 16px;
            position: relative;
        }

.app-header-title {
            color: #ffffff;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

.content-section {
            padding: 24px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

/* ستایلی نیمچە بازنە + ناوی کراش */
        .crash-spinner-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto 0;
            width: 100%;
            gap: 25px;
            padding: 30px 0;
            cursor: pointer;
        }

.spinner-container {
            position: relative;
            width: 200px;
            height: 200px;
        }

.spinner-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid transparent;
            border-top-color: var(--led-cyan);
            border-right-color: var(--led-pink);
            animation: spin-ring 2s linear infinite;
        }

.spinner-ring:nth-child(2) {
            width: 85%;
            height: 85%;
            top: 7.5%;
            left: 7.5%;
            border-top-color: var(--led-green);
            border-right-color: var(--led-amber);
            animation: spin-ring 1.5s linear infinite reverse;
        }

.spinner-ring:nth-child(3) {
            width: 70%;
            height: 70%;
            top: 15%;
            left: 15%;
            border-top-color: var(--led-blue);
            border-right-color: var(--led-red);
            animation: spin-ring 2.5s linear infinite;
        }

@keyframes spin-ring {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

.crash-title {
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(
                90deg,
                var(--led-cyan),
                var(--led-pink),
                var(--led-green),
                var(--led-cyan)
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 3s linear infinite, glow-pulse 2s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.5);
            letter-spacing: 8px;
            position: relative;
        }

@keyframes gradient-shift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

@keyframes glow-pulse {
            0%, 100% { 
                filter: brightness(1) drop-shadow(0 0 10px rgba(0, 242, 254, 0.6));
            }
            50% { 
                filter: brightness(1.3) drop-shadow(0 0 25px rgba(255, 0, 127, 0.8));
            }
        }

/* بەشی ئەکتیڤکردنی سەرەتا (Activation Gate) */
        .activation-box {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto 0;
            width: 100%;
            text-align: center;
            padding: 10px 0;
        }

.activation-icon-glow {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.2) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 2px solid var(--led-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 16px;
            animation: lock-pulse 2s infinite alternate;
        }

@keyframes lock-pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }
            100% { transform: scale(1.06); box-shadow: 0 0 25px rgba(0, 242, 254, 0.6); }
        }

.activation-title {
            font-size: 21px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #ffffff, var(--led-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

.activation-subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 22px;
            font-weight: 500;
        }

.activation-input-wrap {
            position: relative;
            width: 100%;
            max-width: 300px;
            margin-bottom: 12px;
        }

.activation-input-wrap input {
            width: 100%;
            padding: 12px 42px 12px 14px;
            border: 1.5px solid rgba(0, 242, 254, 0.4);
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            text-align: center;
            background: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            outline: none;
            transition: all 0.25s ease;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.15), inset 0 2px 4px rgba(0, 0, 0, 0.4);
            direction: ltr;
        }

.activation-input-wrap input:focus {
            border-color: var(--led-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.5), inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }

.toggle-pwd-btn {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 17px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

.toggle-pwd-btn:hover {
            color: #ffffff;
        }

.activation-msg {
            width: 100%;
            max-width: 300px;
            min-height: 28px;
            font-size: 14px;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 14px;
            display: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

.activation-msg.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #f87171;
            box-shadow: 0 0 14px rgba(239, 68, 68, 0.35);
        }

.activation-msg.success {
            display: block;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #34d399;
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.4);
        }

/* بەشی هەڵبژاردنی زمان */
        .language-selector {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto 0;
            width: 100%;
            text-align: center;
            padding: 20px 0;
            gap: 18px;
        }

.language-selector h2 {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ffffff, var(--led-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

.language-btn {
            width: 100%;
            max-width: 320px;
            padding: 16px 24px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #ffffff;
            border: 2px solid rgba(0, 242, 254, 0.5);
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            border-radius: 14px;
            text-align: center;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

.language-btn:hover {
            border-color: var(--led-cyan);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.5);
            transform: translateY(-3px) scale(1.02);
            background: linear-gradient(135deg, #25334d, #14203a);
        }

.language-btn:active {
            transform: translateY(0) scale(1);
        }

.flag-icon {
            font-size: 28px;
            line-height: 1;
        }

/* گڵۆپی سەوزی لیدی */
        .led-dot {
            width: 9px;
            height: 9px;
            background-color: var(--led-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--led-green);
            animation: pulse-led 1.8s infinite;
        }

@keyframes pulse-led {
            0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 10px var(--led-green); }
            50% { opacity: 0.4; transform: scale(0.85); box-shadow: 0 0 4px var(--led-green); }
        }

.login-box {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto 0;
            width: 100%;
        }

/* ڕێکخستنی شوێنی ناونیشانەکان بۆ تەواوی لای ڕاست */
        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 14px;
            width: 100%;
            max-width: 340px;
        }

.form-row label {
            font-size: 15px;
            font-weight: 700;
            color: #f1f5f9;
            width: 110px;
            text-align: right;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }

.input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

.form-row input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            background: rgba(15, 23, 42, 0.85);
            color: #ffffff;
            outline: none;
            transition: all 0.25s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }

#form-number {
            direction: ltr;
        }

.form-row input:focus {
            border-color: var(--led-cyan);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.35), inset 0 2px 4px rgba(0, 0, 0, 0.4);
            background: rgba(15, 23, 42, 0.95);
        }

.form-row input[readonly] {
            background: rgba(30, 41, 59, 0.6);
            color: #38bdf8;
            border-color: rgba(56, 189, 248, 0.2);
            cursor: default;
        }

/* دوگمەکانی کردار لەگەڵ بریقەی لیدی */
        .btn-action {
            width: 160px;
            padding: 10px 18px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #ffffff;
            border: 1.5px solid rgba(0, 242, 254, 0.6);
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            margin: 12px 0;
            border-radius: 12px;
            text-align: center;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

.btn-action:hover {
            border-color: var(--led-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
            transform: translateY(-2px);
            background: linear-gradient(135deg, #25334d, #14203a);
        }

.btn-action:active {
            transform: translateY(0);
            box-shadow: 0 0 8px rgba(0, 242, 254, 0.3);
        }

.btn-start-quiz {
            border-color: rgba(0, 255, 135, 0.6);
            box-shadow: 0 0 12px rgba(0, 255, 135, 0.2);
        }

.btn-start-quiz:hover {
            border-color: var(--led-green);
            box-shadow: 0 0 20px rgba(0, 255, 135, 0.5);
        }

/* تەختەکلیلی کیپاد - ئاراستەی چەپ بۆ ڕاست */
        .keypad-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px 0;
        }

.keypad-grid {
            direction: ltr;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: rgba(15, 23, 42, 0.7);
            padding: 10px;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            width: 230px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

.key-btn {
            background: linear-gradient(180deg, #1e293b 0%, #151e30 100%);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.1);
            height: 48px;
            font-size: 20px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: all 0.15s ease;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
        }

.key-btn:hover {
            background: linear-gradient(180deg, #2b3952 0%, #1c273e 100%);
            border-color: rgba(0, 242, 254, 0.5);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
            color: var(--led-cyan);
            transform: translateY(-1px);
        }

.key-btn:active {
            transform: translateY(1px);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
            background: #111a2c;
        }

/* دوگمەی سڕینەوە بە ماوس (Backspace) */
        .key-btn.key-delete {
            background: linear-gradient(180deg, #3f1d28 0%, #29121a 100%);
            border-color: rgba(255, 51, 102, 0.4);
            color: #ff4d79;
        }

.key-btn.key-delete:hover {
            background: linear-gradient(180deg, #572032 0%, #361421 100%);
            border-color: var(--led-red);
            box-shadow: 0 0 14px rgba(255, 51, 102, 0.6);
            color: #ffffff;
        }

.key-btn.key-clear {
            background: linear-gradient(180deg, #2d261a 0%, #1e1910 100%);
            border-color: rgba(255, 170, 0, 0.3);
            color: #ffb732;
        }

.key-btn.key-clear:hover {
            background: linear-gradient(180deg, #42351f 0%, #292011 100%);
            border-color: var(--led-amber);
            box-shadow: 0 0 12px rgba(255, 170, 0, 0.5);
            color: #ffffff;
        }

/* بەشی پرسیارەکان */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 12px;
        }

.timer-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2.5px solid var(--led-red);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            font-weight: 800;
            color: #ffffff;
            background: radial-gradient(circle, #2a111a 0%, #101626 100%);
            box-shadow: 0 0 14px rgba(255, 51, 102, 0.5);
            flex-shrink: 0;
            animation: timer-pulse 1s infinite alternate;
        }

@keyframes timer-pulse {
            0% { box-shadow: 0 0 8px rgba(255, 51, 102, 0.4); }
            100% { box-shadow: 0 0 18px rgba(255, 51, 102, 0.8); }
        }

.category-badge {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: #f8fafc;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.15);
            flex-shrink: 0;
        }

.question-text {
            font-size: 17px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.6;
            margin-bottom: 14px;
            text-align: right;
            background: rgba(15, 23, 42, 0.85);
            padding: 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

.question-image-container {
            width: 100%;
            text-align: center;
            margin-bottom: 14px;
            display: none;
        }

.question-image {
            max-width: 100%;
            max-height: 180px;
            border-radius: 12px;
            border: 2px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
            object-fit: contain;
        }

.numbers-wrap-container {
            width: 100%;
            margin-bottom: 16px;
        }

.horizontal-wrap-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            direction: ltr;
        }

.grid-item {
            width: 36px;
            height: 36px;
            background: #1e293b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-weight: 800;
            font-size: 13px;
            border: 2px solid transparent;
            transition: all 0.25s;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

.grid-item.current {
            border-color: var(--led-cyan);
            color: #ffffff;
            background: #0f172a;
            transform: scale(1.15);
            box-shadow: 0 0 12px var(--led-cyan);
        }

.grid-item.correct {
            background-color: #334155 !important;
            color: #e2e8f0 !important;
            border-color: rgba(255, 255, 255, 0.2) !important;
        }

.grid-item.wrong {
            background-color: #334155 !important;
            color: #e2e8f0 !important;
            border-color: rgba(255, 255, 255, 0.2) !important;
        }

.options-title {
            color: #94a3b8;
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 14px;
        }

.options-container-vertical {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
            width: 100%;
        }

.option-btn {
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            color: #f1f5f9;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            padding: 13px 16px;
            border-radius: 12px;
            text-align: right;
            font-size: 15px;
            font-weight: 700;

    function shuffleQuestions() {
        questions = JSON.parse(JSON.stringify(questionsBase));
        for (let i = questions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [questions[i], questions[j]] = [questions[j], questions[i]];
        }
    }

            input.type = "password";
        }
    }

function pressKey(val) {
        const input = document.getElementById('form-number');
        input.value += val;
    }

function deleteKey() {
        const input = document.getElementById('form-number');
        input.value = input.value.slice(0, -1);
    }

function clearKey() {
        const input = document.getElementById('form-number');
        input.value = '';
    }

document.addEventListener('keydown', function(e) {
        const activationGate = document.getElementById('activation-gate');
        if (activationGate && window.getComputedStyle(activationGate).display !== 'none') {
            return;
        }

const loginBox = document.getElementById('login-box');
        if (!loginBox || window.getComputedStyle(loginBox).display === 'none') {
            return;
        }

const input = document.getElementById('form-number');
        if (document.activeElement !== input) {
            if (document.activeElement && document.activeElement.tagName === 'INPUT') {
                return;
            }
            if (e.key >= '0' && e.key <= '9') {
                input.value += e.key;
            } else if (e.key === 'Backspace') {
                deleteKey();
            } else if (e.key === 'Enter') {
                searchForm();
            }
        } else {
            if (e.key === 'Enter') {
                searchForm();
            }
        }
    });

        document.getElementById('timer-display').innerText = timeLeft;
        timer = setInterval(() => {
            timeLeft++;
            if(timeLeft > 60) {
                clearInterval(timer);
                selectAnswer(-1);
            } else {
                document.getElementById('timer-display').innerText = timeLeft;
            }
        }, 1000);
    }

  function sendResetCode() {
    if (!CFG.EMAILJS_SERVICE_ID || !CFG.EMAILJS_TEMPLATE_ID || !CFG.EMAILJS_PUBLIC_KEY) {
      msg('ناردنی ئیمەیڵ هێشتا ڕێکنەخراوە (EmailJS). ڕێنماییەکە بخوێنەوە.', false);
      return;
    }
    if (Date.now() - lastSend < 60000) { msg('تکایە یەک خولەک چاوەڕێ بکە پێش ناردنەوە', false); return; }
    var code = String(100000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 900000));
    msg('کۆد دەنێردرێت ...', true);
    sha(code + '|reset').then(function (h) {
      return fetch('https://api.emailjs.com/api/v1.0/email/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          service_id: CFG.EMAILJS_SERVICE_ID,
          template_id: CFG.EMAILJS_TEMPLATE_ID,
          user_id: CFG.EMAILJS_PUBLIC_KEY,
          template_params: { to_email: CFG.ADMIN_EMAIL, email: CFG.ADMIN_EMAIL, code: code }
        })
      }).then(function (r) {
        if (!r.ok) throw new Error('mail');
        lastSend = Date.now();
        resetState = { hash: h, exp: Date.now() + 10 * 60 * 1000, tries: 0 };
        showForgot2();
      });
    }).catch(function () { msg('ناردنی ئیمەیڵ سەرنەکەوت. ڕێکخستنەکانی EmailJS بپشکنە.', false); });
  }

  function verifyAndSetPassword() {
    var code = normDigits($('adm-code').value.trim());
    var p1 = $('adm-np1').value, p2 = $('adm-np2').value;
    if (!resetState || Date.now() > resetState.exp) { msg('کۆدەکە بەسەرچووە، دووبارە بینێرە', false); return; }
    if (resetState.tries >= 5) { resetState = null; msg('هەوڵەکان زۆر بوون، کۆدێکی نوێ بینێرە', false); return; }
    if (!/^[0-9]{6}$/.test(code)) { msg('کۆدەکە ٦ ژمارەیە', false); return; }
    if (p1.length < 6) { msg('پاسۆرد لانی کەم ٦ پیت بێت', false); return; }
    if (p1 !== p2) { msg('پاسۆردەکان وەک یەک نین', false); return; }
    resetState.tries++;
    Promise.all([sha(code + '|reset'), hashPass(p1)]).then(function (r) {
      if (r[0] !== resetState.hash) { msg('کۆدەکە هەڵەیە', false); return; }
      return dbPatch({ passHash: r[1] }).then(function () {
        resetState = null;
        msg('پاسۆردی نوێ پاشەکەوت کرا. ئێستا بچۆ ژوورەوە.', true);
        setTimeout(showLogin, 1600);

  }

  function collectRows() {
    var fs = document.querySelectorAll('.adm-f'), ns = document.querySelectorAll('.adm-n'), rows = [], seen = {};
    for (var i = 0; i < fs.length; i++) {

      if (seen[f]) return { err: 'ڕیزی ' + (i + 1) + ': ژمارەی فۆرم دووبارەیە (' + f + ')' };
      seen[f] = 1;
      rows.push({ f: f, n: n });
    }

  }

  var LET = { ku: ['A) ', 'B) ', 'C) '], ar: ['أ) ', 'ب) ', 'ج) '], en: ['A) ', 'B) ', 'C) '] };

  function translate(text, tl) {
    text = (text || '').trim();
    if (!text) return Promise.resolve('');
    var g = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=ckb&tl=' + tl + '&dt=t&q=' + encodeURIComponent(text);
    return fetch(g).then(function (r) { return r.json(); }).then(function (j) {
      var out = j[0].map(function (x) { return x[0]; }).join('');
      if (!out) throw new Error('empty');
      return out;
    }).catch(function () {
      var m = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=ckb|' + tl;
      return fetch(m).then(function (r) { return r.json(); }).then(function (j) {
        var out = j && j.responseData && j.responseData.translatedText;
        return out ? out : null;
      }).catch(function () { return null; });
    });
  }
  function fileToDataUrl(file) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () {
          var max = 800, s = Math.min(1, max / Math.max(img.width, img.height));
          var c = document.createElement('canvas');
          c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
          var x = c.getContext('2d');
          x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height);
          x.drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', 0.75));
        };
        img.onerror = rej;
        img.src = fr.result;
      };
      fr.onerror = rej;
      fr.readAsDataURL(file);
    });
  }

        $('adm-q-save').textContent = '💾 پاشەکەوتکردنی گۆڕانکاری';
        $('adm-q-ku').value = q.q || '';
        $('adm-q-ar').value = q.qAr || '';
        $('adm-q-en').value = q.qEn || '';
        for (var i = 0; i < 3; i++) {
          $('adm-a' + i + '-ku').value = stripLetter((q.options || [])[i]);
          $('adm-a' + i + '-ar').value = stripLetter((q.optionsAr || [])[i]);
          $('adm-a' + i + '-en').value = stripLetter((q.optionsEn || [])[i]);
        }
        var rd = document.querySelector('input[name="adm-correct"][value="' + q.correct + '"]');
        if (rd) rd.checked = true;
        if (q.image) {
          if (/^data:/.test(q.image)) pendingImg = q.image; else $('adm-img-url').value = q.image;
          $('adm-prev').src = q.image; $('adm-prev').style.display = 'block';
        }
      } else { editId = null; }
    }
    renderQList();
  }

  function kuFields() {
    return {
      q: $('adm-q-ku').value.trim(),
      a: [0, 1, 2].map(function (i) { return $('adm-a' + i + '-ku').value.trim(); })
    };
  }
  // دەبێتەوە true ئەگەر هەموو بەشەکان پڕ بوونەوە
  function fillTranslations(force) {
    var ku = kuFields();
    var jobs = [];
    ['ar', 'en'].forEach(function (lang) {
      var items = [['adm-q-' + lang, ku.q]].concat([0, 1, 2].map(function (i) { return ['adm-a' + i + '-' + lang, ku.a[i]]; }));
      items.forEach(function (it) {
        var el = $(it[0]);
        if (!force && el.value.trim()) return;
        jobs.push(translate(it[1], lang).then(function (out) { if (out) el.value = out; }));
      });
    });
    return Promise.all(jobs).then(function () {
      return ['ar', 'en'].every(function (lang) {
        return $('adm-q-' + lang).value.trim() && [0, 1, 2].every(function (i) { return $('adm-a' + i + '-' + lang).value.trim(); });
      });
    });
  }

  function saveQuestion() {
    var ku = kuFields();
    var radio = document.querySelector('input[name="adm-correct"]:checked');
    var url = $('adm-img-url').value.trim();
    if (!ku.q) { msg('پرسیارەکە بنووسە', false); return; }
    if (!ku.a[0] || !ku.a[1] || !ku.a[2]) { msg('هەر سێ وەڵامەکە بنووسە', false); return; }
    if (!radio) { msg('وەڵامی ڕاست دیاری بکە', false); return; }
    if (url && !/^https?:\/\//i.test(url)) { msg('لینکی وێنە دەبێت بە http یان https دەستپێبکات', false); return; }
    var wasEdit = !!editId;
    msg('وەرگێڕان و پاشەکەوتکردن ...', true);
    fillTranslations(false).then(function (ok) {
      if (!ok) {
        $('adm-det').open = true;
        msg('وەرگێڕانی خۆکار سەرنەکەوت. بەشە بەتاڵەکانی وەرگێڕان بە دەست بنووسە یان دووبارە هەوڵبدەوە.', false);
        return;
      }
      var get = function (id) { return $(id).value.trim(); };
      var obj = {
        q: ku.q, qAr: get('adm-q-ar'), qEn: get('adm-q-en'),
        image: pendingImg || url || '',
        options: ku.a.map(function (t, i) { return LET.ku[i] + t; }),
        optionsAr: [0, 1, 2].map(function (i) { return LET.ar[i] + get('adm-a' + i + '-ar'); }),
        optionsEn: [0, 1, 2].map(function (i) { return LET.en[i] + get('adm-a' + i + '-en'); }),
        correct: Number(radio.value)
      };
      var map = {};
      Object.keys(QD.questions || {}).forEach(function (k) { map[k] = QD.questions[k]; });
      map[editId || ('q_' + Date.now())] = obj;
      return dbPatch({ questions: map }).then(function () {
        QD.questions = map;
        paneQs();
        msg(wasEdit ? 'گۆڕانکارییەکان پاشەکەوت کران' : 'پرسیارەکە زیاد کرا', true);
      });
    }).catch(function () { msg('پاشەکەوتکردن سەرنەکەوت', false); });
  }

  function renderQList() {
    var l = customList(), box = $('adm-qlist');
    var total = (QD.baseImported ? 0 : questionsBase.length) + l.length;
    var info = '<div class="adm-count" style="margin:0 0 10px">کۆی پرسیارەکان: ' + total + '</div>' +
      (total < CFG.QUIZ_SIZE ? '<div class="adm-warn" style="margin:0 0 10px">⚠️ پێویستە لانی کەم ' + CFG.QUIZ_SIZE + ' پرسیار هەبێت بۆ تاقیکردنەوەکە.</div>' : '');
    if (!l.length) { box.innerHTML = info + '<div class="adm-hint">هێشتا هیچ پرسیارێک لێرە نییە. بۆ دەستکاریکردنی پرسیارە ئەسڵییەکان «هێنانی لیستی ئێستا» دابگرە.</div>'; return; }
    box.innerHTML = info + l.map(function (q, i) {
      return '<div class="adm-qitem">' + (q.image ? '<img src="' + esc(q.image) + '" alt=""/>' : '') +
             '<div class="adm-qinfo">' + (i + 1) + '. ' + esc(q.q) + '<small>وەڵامی ڕاست: ' + 'ABC'.charAt(q.correct) + '</small></div>' +
             '<div style="display:flex;flex-direction:column;gap:6px">' +
             '<button type="button" class="adm-btn adm-edit" data-id="' + esc(q.id) + '">دەستکاری</button>' +
             '<button type="button" class="adm-btn red adm-del" data-id="' + esc(q.id) + '">سڕینەوە</button></div></div>';
    }).join('');
    var es = box.querySelectorAll('.adm-edit');
    for (var e = 0; e < es.length; e++) {
      es[e].addEventListener('click', function () { startEdit(this.getAttribute('data-id')); });
    }
    var ds = box.querySelectorAll('.adm-del');
    for (var i = 0; i < ds.length; i++) {
      ds[i].addEventListener('click', function () {
        var id = this.getAttribute('data-id');
        if (!window.confirm('ئەم پرسیارە بسڕدرێتەوە؟')) return;
        var map = {};
        Object.keys(QD.questions || {}).forEach(function (k) { if (k !== id) map[k] = QD.questions[k]; });
        var left = Object.keys(map).length;
        dbPatch({ questions: left ? map : null }).then(function () {
          QD.questions = left ? map : null;
          if (editId === id) { paneQs(); } else { renderQList(); }
          msg('پرسیارەکە سڕایەوە', true);
        }).catch(function () { msg('سڕینەوە سەرنەکەوت', false); });
      });
    }
  }

  /* ====================== دەستپێکردن ====================== */
  function init() {
    var hdr = document.querySelector('.app-header-bar');
    if (hdr) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'adm-gear';
      b.title = 'ژووری بەڕێوبەر';
      b.setAttribute('aria-label', 'ژووری بەڕێوبەر');
      b.textContent = '⚙️';
      hdr.appendChild(b);
      b.addEventListener('click', openAdmin);
    }
    refreshData();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

})();
//]]>
</script>
<!-- ===================== ژووری بەڕێوبەر (Admin Room) : کۆتایی ===================== -->

</body>
