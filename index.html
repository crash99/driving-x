<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاقیکردنەوەی تیۆری هاتووچۆ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --led-cyan: #00f2fe;
            --led-blue: #4facfe;
            --led-pink: #ff007f;
            --led-green: #00ff87;
            --led-amber: #ffaa00;
            --led-red: #ff3366;
            --bg-dark: #080c14;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(0, 242, 254, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 90%, rgba(255, 0, 127, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(0, 255, 135, 0.05) 0%, transparent 40%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            direction: rtl;
            overflow-x: hidden;
        }

        .app-led-wrapper {
            position: relative;
            width: 100%;
            max-width: 540px;
            border-radius: 26px;
            padding: 3.5px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.25), 0 25px 60px -15px rgba(0, 0, 0, 0.9);
            margin: auto;
        }

        .led-border-glow {
            position: absolute;
            width: 250%;
            height: 250%;
            top: -75%;
            left: -75%;
            background: conic-gradient(from 0deg, var(--led-cyan), var(--led-blue), var(--led-pink), var(--led-amber), var(--led-green), var(--led-cyan));
            animation: rotate-led 4s linear infinite;
            z-index: 1;
            filter: blur(5px);
        }

        .led-border-glow-extra {
            position: absolute;
            width: 250%;
            height: 250%;
            top: -75%;
            left: -75%;
            background: conic-gradient(from 180deg, var(--led-pink), var(--led-cyan), var(--led-green), var(--led-amber), var(--led-blue), var(--led-pink));
            animation: rotate-led 6s linear infinite reverse;
            z-index: 1;
            filter: blur(14px);
            opacity: 0.65;
        }

        @keyframes rotate-led {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .app-container {
            width: 100%;
            background: #0e1628;
            border-radius: 23px;
            overflow: hidden;
            position: relative;
            z-index: 2;
            min-height: 560px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .led-runner-line {
            height: 3px;
            width: 100%;
            background: linear-gradient(90deg, transparent, var(--led-cyan), var(--led-pink), var(--led-green), transparent);
            background-size: 200% 100%;
            animation: runner-move 3s ease infinite;
        }

        @keyframes runner-move {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        .app-header-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: rgba(11, 17, 32, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid rgba(255, 255, 255, 0.06);
            padding: 16px;
            position: relative;
        }

        .app-header-title {
            color: #ffffff;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .content-section {
            padding: 24px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .crash-spinner-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto 0;
            width: 100%;
            gap: 25px;
            padding: 30px 0;
            cursor: pointer;
        }

        .spinner-container {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .spinner-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid transparent;
            border-top-color: var(--led-cyan);
            border-right-color: var(--led-pink);
            animation: spin-ring 2s linear infinite;
        }

        .spinner-ring:nth-child(2) {
            width: 85%;
            height: 85%;
            top: 7.5%;
            left: 7.5%;
            border-top-color: var(--led-green);
            border-right-color: var(--led-amber);
            animation: spin-ring 1.5s linear infinite reverse;
        }

        .spinner-ring:nth-child(3) {
            width: 70%;
            height: 70%;
            top: 15%;
            left: 15%;
            border-top-color: var(--led-blue);
            border-right-color: var(--led-red);
            animation: spin-ring 2.5s linear infinite;
        }

        @keyframes spin-ring {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .crash-title {
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(90deg, var(--led-cyan), var(--led-pink), var(--led-green), var(--led-cyan));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 3s linear infinite, glow-pulse 2s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.5);
            letter-spacing: 8px;
            position: relative;
        }

        @keyframes gradient-shift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        @keyframes glow-pulse {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 10px rgba(0, 242, 254, 0.6)); }
            50% { filter: brightness(1.3) drop-shadow(0 0 25px rgba(255, 0, 127, 0.8)); }
        }

        .activation-box {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto 0;
            width: 100%;
            text-align: center;
            padding: 10px 0;
        }

        .activation-icon-glow {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.2) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 2px solid var(--led-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 16px;
            animation: lock-pulse 2s infinite alternate;
        }

        @keyframes lock-pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }
            100% { transform: scale(1.06); box-shadow: 0 0 25px rgba(0, 242, 254, 0.6); }
        }

        .activation-title {
            font-size: 21px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #ffffff, var(--led-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .activation-subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 22px;
            font-weight: 500;
        }

        .activation-input-wrap {
            position: relative;
            width: 100%;
            max-width: 300px;
            margin-bottom: 12px;
        }

        .activation-input-wrap input {
            width: 100%;
            padding: 12px 42px 12px 14px;
            border: 1.5px solid rgba(0, 242, 254, 0.4);
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            text-align: center;
            background: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            outline: none;
            transition: all 0.25s ease;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.15), inset 0 2px 4px rgba(0, 0, 0, 0.4);
            direction: ltr;
        }

        .toggle-pwd-btn {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 17px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .activation-msg {
            width: 100%;
            max-width: 300px;
            min-height: 28px;
            font-size: 14px;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 14px;
            display: none;
        }

        .activation-msg.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #f87171;
        }

        .activation-msg.success {
            display: block;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #34d399;
        }

        .language-selector {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto 0;
            width: 100%;
            text-align: center;
            padding: 20px 0;
            gap: 18px;
        }

        .language-selector h2 {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ffffff, var(--led-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .language-btn {
            width: 100%;
            max-width: 320px;
            padding: 16px 24px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #ffffff;
            border: 2px solid rgba(0, 242, 254, 0.5);
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            border-radius: 14px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .language-btn:hover {
            border-color: var(--led-cyan);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.5);
            transform: translateY(-3px) scale(1.02);
        }

        .flag-icon { font-size: 28px; line-height: 1; }

        .led-dot {
            width: 9px;
            height: 9px;
            background-color: var(--led-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--led-green);
            animation: pulse-led 1.8s infinite;
        }

        @keyframes pulse-led {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .login-box {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto 0;
            width: 100%;
        }

        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 14px;
            width: 100%;
            max-width: 340px;
        }

        .form-row label {
            font-size: 15px;
            font-weight: 700;
            color: #f1f5f9;
            width: 110px;
            text-align: right;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-row input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            background: rgba(15, 23, 42, 0.85);
            color: #ffffff;
            outline: none;
        }

        #form-number { direction: ltr; }

        .form-row input[readonly] {
            background: rgba(30, 41, 59, 0.6);
            color: #38bdf8;
            border-color: rgba(56, 189, 248, 0.2);
        }

        .btn-action {
            width: 160px;
            padding: 10px 18px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #ffffff;
            border: 1.5px solid rgba(0, 242, 254, 0.6);
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            margin: 12px 0;
            border-radius: 12px;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-start-quiz {
            border-color: rgba(0, 255, 135, 0.6);
            box-shadow: 0 0 12px rgba(0, 255, 135, 0.2);
        }

        .keypad-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px 0;
        }

        .keypad-grid {
            direction: ltr;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: rgba(15, 23, 42, 0.7);
            padding: 10px;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            width: 230px;
            border-radius: 16px;
        }

        .key-btn {
            background: linear-gradient(180deg, #1e293b 0%, #151e30 100%);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.1);
            height: 48px;
            font-size: 20px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .key-btn.key-delete {
            background: linear-gradient(180deg, #3f1d28 0%, #29121a 100%);
            border-color: rgba(255, 51, 102, 0.4);
            color: #ff4d79;
        }

        .key-btn.key-clear {
            background: linear-gradient(180deg, #2d261a 0%, #1e1910 100%);
            border-color: rgba(255, 170, 0, 0.3);
            color: #ffb732;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 12px;
        }

        .timer-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2.5px solid var(--led-red);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            font-weight: 800;
            color: #ffffff;
            background: radial-gradient(circle, #2a111a 0%, #101626 100%);
            box-shadow: 0 0 14px rgba(255, 51, 102, 0.5);
        }

        .category-badge {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: #f8fafc;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .question-text {
            font-size: 17px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.6;
            margin-bottom: 14px;
            text-align: right;
            background: rgba(15, 23, 42, 0.85);
            padding: 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .question-image-container {
            width: 100%;
            text-align: center;
            margin-bottom: 14px;
            display: none;
        }

        .question-image {
            max-width: 100%;
            max-height: 180px;
            border-radius: 12px;
            border: 2px solid rgba(0, 242, 254, 0.3);
            object-fit: contain;
        }

        .numbers-wrap-container { width: 100%; margin-bottom: 16px; }

        .horizontal-wrap-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            direction: ltr;
        }

        .grid-item {
            width: 36px;
            height: 36px;
            background: #1e293b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-weight: 800;
            font-size: 13px;
            border: 2px solid transparent;
        }

        .grid-item.current { border-color: var(--led-cyan); color: #ffffff; background: #0f172a; transform: scale(1.15); }
        .grid-item.correct { background-color: #334155 !important; color: #e2e8f0 !important; }
        .grid-item.wrong { background-color: #334155 !important; color: #e2e8f0 !important; }

        .options-title { color: #94a3b8; font-weight: 700; margin-bottom: 10px; font-size: 14px; }
        .options-container-vertical { display: flex; flex-direction: column; gap: 10px; margin-top: auto; width: 100%; }

        .option-btn {
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            color: #f1f5f9;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            padding: 13px 16px;
            border-radius: 12px;
            text-align: right;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .option-btn.selected-correct, .option-btn.selected-wrong { background-color: #475569 !important; color: white !important; }

        .result-box { text-align: center; margin: auto 0; padding: 24px 15px; }
        .result-title { font-size: 22px; font-weight: 800; margin-bottom: 16px; line-height: 1.6; }
        .result-title.pass { color: #4ade80; }
        .result-title.fail { color: #f87171; }

        .score-badge {
            font-size: 32px;
            font-weight: 800;
            background: rgba(15, 23, 42, 0.9);
            padding: 16px 36px;
            border-radius: 18px;
            border: 2px solid rgba(0, 242, 254, 0.4);
            margin-bottom: 25px;
            display: inline-block;
            color: #ffffff;
        }

        .footer-text {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            padding: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            margin-top: auto;
            background: rgba(11, 17, 32, 0.9);
            font-weight: 600;
        }

        /* ستایلی ژووری بەڕێوبەر (Admin Room) */
        .adm-gear { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:38px; height:38px; border-radius:50%; border:1.5px solid rgba(0,242,254,0.55); background:rgba(15,23,42,0.92); color:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; box-shadow:0 0 10px rgba(0,242,254,0.25); }
        .adm-gear:hover { box-shadow:0 0 18px rgba(0,242,254,0.6); border-color:var(--led-cyan); }
        .adm-overlay { position:fixed; top:0; right:0; bottom:0; left:0; z-index:99999; background:rgba(4,8,16,0.95); overflow-y:auto; direction:rtl; padding:14px; display:none; text-align:right; }
        .adm-card { max-width:640px; margin:0 auto; background:#0e1628; border:1.5px solid rgba(0,242,254,0.45); border-radius:20px; box-shadow:0 0 30px rgba(0,242,254,0.25); color:#f8fafc; overflow:hidden; }
        .adm-head { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid rgba(255,255,255,0.08); background:rgba(11,17,32,0.9); }
        .adm-title { font-size:17px; font-weight:800; }
        .adm-x { width:34px; height:34px; border-radius:50%; border:1.5px solid rgba(255,51,102,0.6); background:rgba(63,29,40,0.8); color:#fff; font-size:16px; cursor:pointer; padding:0; }
        .adm-pad { padding:18px 16px; }
        .adm-field { margin-bottom:12px; }
        .adm-field label { display:block; font-size:13px; font-weight:700; color:#cbd5e1; margin-bottom:5px; }
        .adm-in { width:100%; padding:10px 12px; border:1.5px solid rgba(255,255,255,0.15); border-radius:10px; background:rgba(15,23,42,0.9); color:#fff; font-size:15px; font-weight:600; outline:none; }
        .adm-ltr { direction:ltr; text-align:left; }
        .adm-btn { padding:10px 16px; border-radius:12px; border:1.5px solid rgba(0,242,254,0.6); background:linear-gradient(135deg,#1e293b,#0f172a); color:#fff; font-size:14px; font-weight:800; cursor:pointer; }
        .adm-btn.green { border-color:rgba(0,255,135,0.65); }
        .adm-btn.red { border-color:rgba(255,51,102,0.65); }
        .adm-btn.ghost { border-color:rgba(255,255,255,0.25); background:transparent; }
        .adm-link { background:none; border:none; color:var(--led-cyan); cursor:pointer; font-size:13px; font-weight:700; text-decoration:underline; }
        .adm-eye { position:absolute; left:8px; top:50%; transform:translateY(-50%); background:transparent; border:none; color:#94a3b8; cursor:pointer; font-size:16px; }
        .adm-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
        .adm-msg { display:none; padding:9px 12px; border-radius:10px; font-size:13px; font-weight:700; margin:10px 0; }
        .adm-msg.ok { background:rgba(16,185,129,0.15); border:1px solid #10b981; color:#34d399; }
        .adm-msg.err { background:rgba(239,68,68,0.15); border:1px solid #ef4444; color:#f87171; }
        .adm-warn { margin:12px 16px 0; padding:9px 12px; border-radius:10px; background:rgba(255,170,0,0.12); border:1px solid #ffaa00; color:#ffcc66; font-size:12.5px; font-weight:700; }
        .adm-hint { font-size:12.5px; color:#94a3b8; line-height:1.7; margin-bottom:10px; }
        .adm-tabs { display:flex; gap:6px; flex-wrap:wrap; padding:10px 12px; border-bottom:1px solid rgba(255,255,255,0.08); }
        .adm-tab { padding:8px 12px; border-radius:10px; border:1.5px solid rgba(255,255,255,0.15); background:transparent; color:#cbd5e1; font-size:13px; font-weight:800; cursor:pointer; }
        .adm-tab.on { border-color:var(--led-cyan); background:#0f172a; color:#fff; box-shadow:0 0 12px rgba(0,242,254,0.35); }
        .adm-tab.adm-out { margin-right:auto; border-color:rgba(255,51,102,0.5); }
        .adm-scroll { max-height:52vh; overflow-y:auto; border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:4px; }
        .adm-table { width:100%; border-collapse:collapse; }
        .adm-table th { font-size:12px; color:#94a3b8; padding:6px 4px; text-align:center; }
        .adm-table td { padding:3px; }

    }

    function toggleActivationVisibility() {
        const input = document.getElementById('activation-code-input');
        input.type = input.type === "password" ? "text" : "password";
    }

    function pressKey(val) { document.getElementById('form-number').value += val; }
    function deleteKey() { const input = document.getElementById('form-number'); input.value = input.value.slice(0, -1); }
    function clearKey() { document.getElementById('form-number').value = ''; }

    const studentForms = {
        "2026": "نوسینگەی شوفێری مەهتاب",
        "95577": "دنیا محمد قادر",
        "94097": "ایرج نجف کیامینش",
        "92651": "ئاسۆ اسکندر رحمان",
        "94411": "محمد عمر جلال",
        "94387": "مەبەست سعید محمد",
        "38474": "دیاری بارزان قادر",
        "94645": "ایاد سامان علی"
    };

    function searchForm() {
        const t = translations[currentLanguage];
        let formNum = document.getElementById('form-number').value.trim();
        if(studentForms[formNum]) {
            document.getElementById('full-name').value = studentForms[formNum];
        } else {
            alert(t.alertFormError);
        }
    }

    function initGrid() {
        const grid = document.getElementById('grid-container');
        grid.innerHTML = '';
        for(let i = 1; i <= 25; i++) {
            const item = document.createElement('div');
            item.className = 'grid-item';
            item.id = 'grid-' + (i - 1);
            item.innerText = i;
            grid.appendChild(item);
        }
    }

    function startQuiz() {
        const t = translations[currentLanguage];
        const nameInput = document.getElementById('full-name').value.trim();
        if(!nameInput) {
            alert(t.alertNameError);
            return;
        }
        userName = nameInput;
        shuffleQuestions();
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('quiz-box').style.display = 'flex';
        initGrid();
        loadQuestion(0);
    }

    function startTimer() {
        clearInterval(timer);
        timeLeft = 1;
        document.getElementById('timer-display').innerText = timeLeft;
        timer = setInterval(() => {
            timeLeft++;
            if(timeLeft > 60) {
                clearInterval(timer);
                selectAnswer(-1);
            } else {
                document.getElementById('timer-display').innerText = timeLeft;
            }
        }, 1000);
    }

    function loadQuestion(index) {
        currentQ = index;
        const qData = questions[index % questions.length];
        const t = translations[currentLanguage];

        let questionText = qData.q;
        let optionsArray = qData.options;
        
        if(currentLanguage === 'ar') {
            questionText = qData.qAr || qData.q;
            optionsArray = qData.optionsAr || qData.options;
        } else if(currentLanguage === 'en') {
            questionText = qData.qEn || qData.q;
            optionsArray = qData.optionsEn || qData.options;
        }

        document.getElementById('question-title').innerText = t.questionPrefix + (index + 1) + ": " + questionText;

        const imgContainer = document.getElementById('q-img-container');
        const imgEl = document.getElementById('q-img');
        if(qData.image) {
            imgEl.src = qData.image;
            imgContainer.style.display = 'block';
        } else {
            imgContainer.style.display = 'none';
            imgEl.src = '';
        }

        document.getElementById('opt0').innerText = optionsArray[0];
        document.getElementById('opt1').innerText = optionsArray[1];
        document.getElementById('opt2').innerText = optionsArray[2];

        document.querySelectorAll('.option-btn').forEach(btn => btn.className = 'option-btn');

        for(let i = 0; i < 25; i++) {
            const gridEl = document.getElementById('grid-' + i);
            if(i === index) gridEl.classList.add('current');
            else gridEl.classList.remove('current');
        }

        startTimer();
    }

    function selectAnswer(optionIndex) {
        clearInterval(timer);
        const qData = questions[currentQ % questions.length];
        const gridEl = document.getElementById('grid-' + currentQ);

        const isCorrect = (optionIndex === qData.correct);
        userAnswers[currentQ] = isCorrect;

        if(isCorrect) gridEl.classList.add('correct');
        else gridEl.classList.add('wrong');

        const btns = document.querySelectorAll('.option-btn');
        if(optionIndex >= 0 && optionIndex < 3) {
            if(isCorrect) btns[optionIndex].classList.add('selected-correct');
            else btns[optionIndex].classList.add('selected-wrong');
        }

        setTimeout(() => {
            if(currentQ < 24) {
                loadQuestion(currentQ + 1);
            } else {
                showResults();
            }
        }, 400);
    }

    function showResults() {
        document.getElementById('quiz-box').style.display = 'none';
        document.getElementById('result-box').style.display = 'block';

        let correctCount = userAnswers.filter(ans => ans === true).length;
        let wrongCount = 25 - correctCount;

        const msgEl = document.getElementById('result-msg');
        const scoreEl = document.getElementById('score-display');
        const t = translations[currentLanguage];

        scoreEl.innerText = correctCount + " / 25";

        if(wrongCount <= 5) {
            msgEl.className = 'result-title pass';
            msgEl.innerText = t.resultPass.replace('{name}', userName);
        } else {
            msgEl.className = 'result-title fail';
            msgEl.innerText = t.resultFail.replace('{name}', userName);
        }
    }

    function restartQuiz() {
        currentQ = 0;
        userAnswers = new Array(25).fill(null);
        document.getElementById('result-box').style.display = 'none';
        document.getElementById('login-box').style.display = 'flex';
        document.getElementById('form-number').value = '';
        document.getElementById('full-name').value = '';
    }
</script>

<!-- بەشی ژووری بەڕێوبەر (Admin Room) -->
<div id="adm-overlay" class="adm-overlay">
    <div class="adm-card">
        <div class="adm-head">
            <div class="adm-title" id="adm-title">ژووری بەڕێوبەر</div>
            <button type="button" class="adm-x" onclick="closeAdmin()">✕</button>
        </div>
        <div id="adm-body" class="adm-pad">
            <div class="adm-field">
                <label>ناوی بەکارهێنەر</label>
                <input class="adm-in adm-ltr" id="adm-user" autocomplete="off">
            </div>
            <div class="adm-field">
                <label>پاسۆرد</label>
                <div style="position:relative">
                    <input class="adm-in adm-ltr" id="adm-pass" type="password" autocomplete="off" style="padding-left:38px">
                    <button type="button" class="adm-eye" onclick="let p=$('adm-pass'); p.type=p.type==='password'?'text':'password';">👁️</button>
                </div>
            </div>
            <div class="adm-msg" id="adm-msg"></div>
            <div class="adm-row" style="justify-content:space-between">
                <button type="button" class="adm-btn" onclick="doLogin()">چوونەژوورەوە</button>
            </div>
        </div>
    </div>
</div>

<script>
    function $(id) { return document.getElementById(id); }
    function openAdmin() { $('adm-overlay').style.display = 'block'; }
    function closeAdmin() { $('adm-overlay').style.display = 'none'; }
    
    function doLogin() {
        let u = $('adm-user').value.trim();
        let p = $('adm-pass').value;
        let m = $('adm-msg');
        if(u === "crash_cr4" && p === "crash2026") {
            m.className = "adm-msg ok";
            m.innerText = "بە سەرکەوتوویی چوویە ژوورەوە!";
            m.style.display = "block";
            setTimeout(() => { closeAdmin(); alert("بەڕێوبەر: لێرەدا دەتوانیت کۆنتڕۆڵی سیستەم بکەیت."); }, 800);
        } else {
            m.className = "adm-msg err";
            m.innerText = "ناوی بەکارهێنەر یان پاسۆرد هەڵەیە!";
            m.style.display = "block";
        }
    }

    // زیادکردنی گمبەی بەڕێوبەر بۆ سەر سەری وێبسایتەکە
    window.addEventListener('DOMContentLoaded', () => {
        let hdr = document.querySelector('.app-header-bar');
        if (hdr) {
            let b = document.createElement('button');
            b.type = 'button';
            b.className = 'adm-gear';
            b.title = 'ژووری بەڕێوبەر';
            b.innerHTML = '⚙️';
            hdr.appendChild(b);
            b.addEventListener('click', openAdmin);
        }
    });
</script>
